.sheet.on{transform:none}

#res li{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*20);padding:calc(var(--u)*26) calc(var(--u)*12);border-radius:calc(var(--u)*28);cursor:pointer}
#res li:hover,#res li:focus-visible{background:#202020;outline:none}
#res .n{font-weight:600;font-size:calc(var(--u)*38)}
#res .s{color:var(--mute);font-size:calc(var(--u)*30)}
#res .p{font-variant-numeric:tabular-nums;font-size:calc(var(--u)*34)}
#res .empty{color:var(--mute);cursor:default;justify-content:center}

.acts button:focus-visible{outline:2px solid var(--accent)}

.sh{font-size:calc(var(--u)*44);font-weight:700;margin:0 0 calc(var(--u)*28)}

#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
