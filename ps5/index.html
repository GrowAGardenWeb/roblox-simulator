<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>PS5 Home Simulator</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;background:#000;overflow:hidden;font-family:"SST","Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}

  .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0) 55%)}
  /* top bar */
  .tabs{position:absolute;left:76px;top:32px;font-size:28px;display:flex;gap:66px;color:#9aa}
  .tabs b{color:#fff;font-weight:500}
  .tr{position:absolute;right:70px;top:34px;display:flex;align-items:center;gap:56px;font-size:28px}
  .tr img{width:44px;height:44px;display:block;cursor:pointer;margin:0 -6px}
  /* rail */
  .rail{position:absolute;left:44px;top:100px;height:150px;display:flex;align-items:flex-start;gap:6px}
  .rail{transition:transform .45s cubic-bezier(.22,.9,.3,1)}
  .hero.in h1,.hero.in p{animation:up .55s cubic-bezier(.2,.8,.2,1) both}.hero.in p{animation-delay:.07s}
  .trophy.in{animation:fi .5s .12s ease both}
  .btns.in{animation:slideb .5s .12s cubic-bezier(.2,.8,.2,1) both}
  @keyframes slideb{from{transform:translateY(10px)}to{transform:none}}
  .card.in{animation:pop .55s cubic-bezier(.2,.9,.3,1) both}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes fi{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
  .set.on:not(.stay) .row,.set.on:not(.stay) h2{animation:fi .45s ease both}
  .cc.on img{animation:fi .5s ease both}
  .tile{position:relative;flex:none;width:88px;height:88px;border-radius:10px;margin-top:6px;overflow:visible;background:#1c2130;transition:width .3s cubic-bezier(.22,.9,.3,1),height .3s cubic-bezier(.22,.9,.3,1),margin .3s cubic-bezier(.22,.9,.3,1),border-radius .3s,box-shadow .3s;background-size:cover;background-position:center;cursor:pointer;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.05;letter-spacing:.3px;padding:4px}
  .tile.sel{width:146px;height:146px;margin-top:0;border-radius:18px;box-shadow:0 0 0 4px #fff,0 0 0 8px rgba(255,255,255,.18)}
  .tile.sel:not(.lg){}
  .tile.sm{width:94px}
  .gname{position:absolute;left:0;top:152px;font-size:22px;font-weight:400;white-space:nowrap;display:none;text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .tile.sel .gname{display:flex;align-items:center;gap:12px;left:164px;top:112px}
  .gname i{font-style:normal;font-size:13px;font-weight:700;line-height:22px;padding:0 10px;border-radius:4px;background:rgba(235,238,244,.88);color:#6b7280;letter-spacing:.5px}
  .tile.sel .gname{position:absolute}
  /* hero */
  .hero{position:absolute;left:140px;top:430px;width:900px}
  .hero h1 img{display:block;width:200px;height:auto;filter:drop-shadow(0 4px 16px rgba(40,10,70,.5))}
  .hero.gta{top:378px}
  .hero h1{font-size:64px;line-height:62px;font-weight:800;letter-spacing:1px;text-transform:uppercase;white-space:pre-line}
  .hero p{margin-top:20px;font-size:25px;line-height:35px;color:#dfe6f0;max-width:700px;min-height:70px}
  .btns.gta .play,.btns.gta .dots{background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .btns{position:absolute;left:140px;top:685px;display:flex;gap:14px}
  .play{width:272px;height:58px;border-radius:30px;background:rgba(40,52,78,.6);font-size:23px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .dots{width:58px;height:58px;border-radius:50%;background:rgba(40,52,78,.55);font-size:34px;display:flex;align-items:center;justify-content:center;letter-spacing:2px;cursor:pointer}
  .trophy{position:absolute;right:140px;top:728px;display:flex;gap:70px;font-size:23px;color:#cfd8e6;align-items:center}
  .trophy small{display:block;font-size:19px;color:#9eabc0}
  .card{position:absolute;left:1130px;top:330px;width:305px;height:305px;background:linear-gradient(#0b2b8f,#071a5a);box-shadow:0 8px 40px rgba(0,0,0,.5);display:none;padding:14px;font-weight:800}
  .card .t{font-size:44px;line-height:40px;letter-spacing:.5px}
  .card .tag{position:absolute;left:20px;bottom:28px;border:1px solid #fff;font-size:12px;padding:2px 10px;font-weight:500}
  .card .fr{position:absolute;left:20px;bottom:0;font-size:14px;font-weight:600}
  /* settings screens */
  .set{position:absolute;inset:0;background:radial-gradient(70% 70% at 25% 0,#5a4a3f 0,#201d26 35%,#0c0b12 75%);display:none}
  .set.on{display:block}
  .set h2{position:absolute;left:80px;top:62px;font-size:38px;font-weight:300}
  .row{position:absolute;left:0;right:0;height:80px;display:flex;align-items:center;font-size:28px;font-weight:300;cursor:pointer}
  .row img{width:46px;height:46px;margin:0 22px 0 -6px;flex:none}
  .hl{position:absolute;box-shadow:inset 0 0 0 2px #cfd6e4;background:rgba(255,255,255,.07);pointer-events:none}
  .hs{position:absolute;height:3px;border-radius:2px;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(255,255,255,.85),rgba(255,255,255,.35) 60%,rgba(255,255,255,0));filter:blur(.6px);transform-origin:0 50%}
  .hl.mv{animation:hlin .42s linear both}
  .hs.mv{animation:sweep .42s cubic-bezier(.2,.8,.2,1) both}
  @keyframes hlin{0%,55%{opacity:0}100%{opacity:1}}
  @keyframes sweep{0%{opacity:0;transform:scaleX(.15)}25%{opacity:1;transform:scaleX(1)}75%{opacity:.6}100%{opacity:0;transform:scaleX(1)}}
  .hr{position:absolute;height:1px;background:rgba(255,255,255,.12)}
  /* control center */
  .cc{position:absolute;left:0;right:0;bottom:0;top:0;background:#000;display:none}
  .cc.on{display:block}
  .ccb{position:absolute;left:0;right:0;bottom:36px;display:flex;justify-content:center;gap:68px}
  .ccb svg{width:42px;height:42px;fill:#fff;opacity:.9}
  .cards{position:absolute;left:76px;top:340px;display:flex;gap:6px}
  .cd{width:362px;height:440px;border-radius:14px;background:linear-gradient(#202533,#12141d);padding:24px;font-size:22px;color:#c8d0de;display:flex;flex-direction:column;justify-content:flex-end}
  .cd b{display:block;font-size:30px;color:#fff;font-weight:600;margin-top:4px}
  .cd.sel{box-shadow:0 0 0 3px #fff}.cd.sm{width:292px;height:330px;margin-top:110px}
  .fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}.fade.on{opacity:1}
</style>
</head>
<body>
<div id="wrap"><div class="scr" id="scr">
  <div id="bgs"></div><div class="scrim"></div>
  <div class="tabs"><b>Games</b><span>Media</span></div>
  <div class="tr"><img id="bSearch" src="assets/svg/tb_search.svg" alt=""><img id="bGear" src="assets/svg/tb_gear.svg" alt=""><img id="bProf" src="assets/svg/tb_face.svg" alt=""><span id="clock">17:14</span></div>

  <div class="btns"><div class="play" id="play">Play</div><div class="dots">&middot;&middot;&middot;</div></div>

  <div class="card" id="card"><div class="t" id="cT"></div><div class="tag">Full Game</div><div class="fr">Free</div></div>
  <div class="set" id="st1"></div><div class="set" id="st2"></div>
  <div class="cc" id="cc"></div>
  <div class="fade" id="fade"></div>
</div></div>
<script>

    {k:'gta',plat:'PS5',ic:'ic_gta.png',large:'ic_gta_l.png',n:'Grand Theft Auto VI',logo:'gta_logo.png',t:'GTA',d:'Experience the biggest, most immersive evolution of the Grand Theft Auto series.',bg:'bg_gta.jpg',play:'Play Game',tr:null},
    {k:'astro',ic:'ic_astro.png',large:'ic_astro_l.png',n:"ASTRO's PLAYROOM",t:"ASTRO's\nPLAYROOM",d:'Discover the future of play with intergalactic platforming hero – ASTRO!',bg:'full_astro.jpg',baked:true,col:'linear-gradient(#0b2b8f,#06174f)',lab:"ASTRO's\nPLAYROOM",card:true,tr:['15%','10/46'],ps:'PS5'},
    {k:'destiny',ic:'ic_destiny.png',large:'ic_destiny_l.png',n:'Destiny 2 | PS4',t:'DESTINY Ⅴ 2',d:'',bg:'full_destiny.jpg',baked:true,col:'#232830',lab:'DESTINY 2',tr:['100%','24/24']},
    {k:'spider',ic:'ic_spider.png',large:'ic_spider_l.png',n:"Marvel's Spider-Man: Miles Morales",t:'SPIDER-MAN\nMILES MORALES',d:'Be Greater. Be Yourself.',bg:'full_spider.jpg',baked:true,col:'linear-gradient(#1d1b25,#0d0c14)',lab:'SPIDER-MAN',tr:null},
    {k:'rl',ic:'ic_rl.png',n:'Rocket League',col:'linear-gradient(135deg,#f2f2f2,#2d63d8)',lab:'ROCKET\nLEAGUE',bg:'clean_destiny.jpg',t:'ROCKET\nLEAGUE',d:'',tr:['34%','12/38']},
    {k:'wf',ic:'ic_wf.png',n:'Warframe',col:'linear-gradient(135deg,#8e9aa3,#3a444c)',lab:'WARFRAME',bg:'clean_destiny.jpg',t:'WARFRAME',d:'',tr:null},
    {k:'cod',ic:'ic_cod.png',n:'Call of Duty: Modern Warfare',col:'linear-gradient(135deg,#5a5a52,#1b1b18)',lab:'MODERN\nWARFARE',bg:'clean_spider.jpg',t:'MODERN\nWARFARE',d:'',tr:null},
    {k:'apex',ic:'ic_apex.png',n:'Apex Legends',col:'linear-gradient(135deg,#59b8c8,#e59f8c)',lab:'APEX',bg:'clean_spider.jpg',t:'APEX\nLEGENDS',d:'',tr:null},
    {k:'plus',ic:'ic_plus.png',n:'PlayStation Plus',col:'#171c28',lab:'✚',gold:true},

  function tone(f1,f2,dur,vol,type){var c=ctx();if(!c)return;var o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02)}
  /* background music taken from the recording (Spider-Man home screen and the control center); the clip loops while that screen is up */
  function music(name){if(curM===name)return;var old=curM;curM=name;
    if(old&&mus[old]){var o=mus[old];var iv=setInterval(function(){o.volume=Math.max(0,o.volume-.08);if(o.volume<=.01){clearInterval(iv);o.pause()}},40)}
    if(name){var a=mus[name];if(!a){a=mus[name]=new Audio('assets/m_'+name+'.mp3');a.loop=true}a.volume=0;var p=a.play();if(p&&p.catch)p.catch(function(){});var v=0,iv2=setInterval(function(){v=Math.min(.6,v+.05);a.volume=v;if(v>=.6||curM!==name)clearInterval(iv2)},50)}}

    open:function(){tone(520,780,.18,.06,'triangle');setTimeout(function(){tone(780,1040,.2,.05,'triangle')},70)},
    back:function(){tone(820,460,.16,.05,'triangle')},
    ok:function(){tone(900,1350,.09,.06)}
  };
  document.addEventListener('pointerdown',function(){ctx()},{once:true});
  /* ---- rail: tiles are built once so size changes animate smoothly ---- */
  var tiles=[];
  (function(){var r=$('rail');G.forEach(function(g,i){var t=document.createElement('div');t.className='tile';t.style.backgroundImage='url(assets/'+g.ic+')';if(g.large){var l=new Image();l.src='assets/'+g.large}var n=document.createElement('div');n.className='gname';n.innerHTML=(G[i].plat?'<i>'+G[i].plat+'</i>':'')+'<span></span>';n.querySelector('span').textContent=g.n||'';t.appendChild(n);t.onclick=function(){if(i!==sel){sel=i;SFX.game();draw()}else SFX.ok()};r.appendChild(t);tiles.push(t)})})();

    /* keep the selected tile in view (the rail scrolls like the real one) */

    Object.keys(bgEl).forEach(function(k){bgEl[k].classList.toggle('on',g.bg===k)});
    if(cur==='scr')music(g.k==='spider'?'spider':null);
    var isGame=!!g.t&&!g.baked,h=document.querySelector('.hero'),bt=document.querySelector('.btns'),tr=$('troph'),c=$('card');
    h.classList.toggle('gta',!!g.logo);bt.classList.toggle('gta',!!g.logo);[h,bt,tr,c].forEach(function(e){e.classList.remove('in');void e.offsetWidth});
    $('hT').innerHTML=isGame?(g.logo?'<img src="assets/'+g.logo+'" alt="">':''):'';if(isGame&&!g.logo)$('hT').textContent=g.t||'';$('play').textContent=g.play||'Play';$('hD').textContent=isGame?(g.d||''):'';
    bt.style.display=isGame?'flex':'none';
    tr.style.display=g.tr&&!g.baked?'flex':'none';if(g.tr)tr.innerHTML='<span>\u{1F3C6}</span><span><small>Progress</small>'+g.tr[0]+'</span><span><small>Earned</small>'+g.tr[1]+'</span>';
    c.style.display=g.card&&!g.baked?'block':'none';$('cT').textContent=g.t||'';$('cT').style.whiteSpace='pre-line';
    [h,bt,tr,c].forEach(function(e){e.classList.add('in')})}
  draw();
  document.addEventListener('keydown',function(e){if(cur!=='scr')return;if(e.key==='ArrowRight'&&sel<G.length-1){sel++;SFX.game();draw()}if(e.key==='ArrowLeft'&&sel>0){sel--;SFX.game();draw()}});
  var sx=null;$('scr').addEventListener('pointerdown',function(e){sx=e.clientX});$('scr').addEventListener('pointerup',function(e){if(sx===null||cur!=='scr')return;var d=e.clientX-sx;sx=null;if(Math.abs(d)>70){var n=Math.max(0,Math.min(G.length-1,sel+(d<0?1:-1)));if(n!==sel){sel=n;SFX.game();draw()}}});
  /* clock */
  function clk(){var d=new Date();$('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}clk();setInterval(clk,15000);
  /* settings */
  var IC={sys:'M12 2l9 5v10l-9 5-9-5V7z',sto:'M4 6c0-2 16-2 16 0v12c0 2-16 2-16 0z',snd:'M3 9h4l5-4v14l-5-4H3zM15 8a5 5 0 0 1 0 8',scr:'M3 6h18v12H3z',acc:'M4 7h16v8H4zM8 18h8',sav:'M5 5h6v6H5zM13 5h6v6h-6zM5 13h6v6H5z',not:'M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6zm-2 15a2 2 0 0 0 4 0',cap:'M7 4H4v3M17 4h3v3M7 20H4v-3M17 20h3v-3M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6',net:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM2 12h20M12 2q6 10 0 20M12 2q-6 10 0 20',usr:'M5 4h14v16H5zM9 9a3 3 0 1 0 6 0 3 3 0 0 0-6 0zM8 16h8',acs:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8v2M8 11h8M10 18l2-5 2 5',fam:'M5 4h6v6H5zM13 4h6v6h-6zM5 14h6v6H5z',gui:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v6M12 7v1'};
  var SIM={gui:'guide',acs:'access',net:'network',usr:'users',fam:'family',sys:'system',sto:'storage',snd:'sound',scr:'screen',acc:'accessories',sav:'saved',not:'notifications',cap:'captures'};
  function ico(k){return '<img src="assets/svg/si_'+SIM[k]+'.svg" alt="">'}

  var si=2,sTop=0;

    h+='<div class="hl'+(anim?' mv':'')+'" style="top:'+hy+'px;left:420px;right:80px;height:80px"></div><div class="hs'+(anim?' mv':'')+'" style="top:'+(hy+50)+'px;left:420px;right:150px"></div>';
    $('st1').classList.toggle('stay',!!anim);$('st1').innerHTML=h;$('st1').querySelectorAll('.row').forEach(function(e){e.onclick=function(){si=+e.dataset.i;if(SET[si][1]==='Screen and Video'){go('st2')}else{SFX.move();drawSet(true)}}})}
  var VID=[['Video Output',[['Video Output Information',''],['Resolution','Automatic'],['4K Video Transfer Rate','Automatic'],['HDR','Off'],['Adjust HDR',''],['Deep Colour Output','Automatic'],['RGB Range','Automatic (Recommended)']]],['Screen',[['Adjust Display Area',''],['Dim Screen While Inactive',"Don't Dim"]]],['BD/DVD',[['BD/DVD Region Code','']]]],vi=0;
  function drawVid(anim){var h='<h2>Screen and Video</h2>';VID.forEach(function(v,i){var y=170+i*85;h+='<div class="row" data-v="'+i+'" style="top:'+y+'px;left:310px;width:326px;padding-left:24px;font-size:26px;height:84px">'+v[0]+'</div>'});
    VID[vi][1].forEach(function(r,i){var y=150+i*81;h+='<div class="row" style="top:'+y+'px;left:724px;right:80px;font-size:26px;height:80px">'+r[0]+'<span style="margin-left:auto;font-size:20px;color:#9aa">'+r[1]+'</span></div><div class="hr" style="top:'+(y+80)+'px;left:724px;right:80px"></div>'});

    $('st2').classList.toggle('stay',!!anim);$('st2').innerHTML=h;$('st2').querySelectorAll('[data-v]').forEach(function(e){e.onclick=function(){vi=+e.dataset.v;SFX.move();drawVid(true)}})}
  function go(to){(to==='scr'?SFX.back:SFX.open)();var f=$('fade');f.classList.add('on');setTimeout(function(){['st1','st2','cc'].forEach(function(i){$(i).classList.remove('on')});if(to==='st1'){drawSet();$('st1').classList.add('on')}if(to==='st2'){drawVid();$('st2').classList.add('on')}if(to==='cc')$('cc').classList.add('on');cur=to;music(to==='cc'?'cc':(to==='scr'&&G[sel].k==='spider'?'spider':null));setTimeout(function(){f.classList.remove('on')},60)},330)}

  /* back: tap the title */
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(cur==='st2')go('st1');else go('scr0')}});
  $('st1').onpointerdown=function(e){if(e.target===$('st1')||e.target.tagName==='H2')go('scr0')};
  $('st2').onpointerdown=function(e){if(e.target===$('st2')||e.target.tagName==='H2')go('st1')};
  var _go=go;go=function(t){_go(t==='scr0'?'scr':t)};
})();
</script>
</body>
</html>
