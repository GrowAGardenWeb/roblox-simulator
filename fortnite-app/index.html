html,body{height:100%;overflow:hidden;background:#0a1a33;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;z-index:0}
#bgfx{position:fixed;inset:0;z-index:0;background:center/cover no-repeat}
body[data-screen="lobby"] #bgfx{display:none}
body:not([data-screen="lobby"]) #bg{visibility:hidden}
body[data-screen="treasure"] #bgfx{background-image:url(assets/bg_treasure.webp)}
body[data-screen="shop"] #bgfx{background-image:url(assets/bg_shop.webp)}
#stage{position:absolute;left:50%;top:50%;width:2000px;height:921px;transform-origin:center;overflow:hidden;z-index:1;user-select:none;color:#fff}
.screen{position:absolute;inset:0}.screen[hidden]{display:none}
.px{position:absolute;display:block;pointer-events:none;-webkit-user-drag:none}
.px[hidden]{display:none}
.btn,.tab,.card{pointer-events:auto;cursor:pointer}.btn:active,.tab:active{filter:brightness(.92)}
.card{transition:transform .12s}.card:hover{transform:translateY(-5px)}.card[data-sel="1"]{filter:drop-shadow(0 0 0 #fff) brightness(1.08)}
.t{position:absolute;white-space:nowrap;pointer-events:none;line-height:1}

.hv,.navlabel,.nm,.st,.it{text-shadow:0 3px 4px rgba(0,0,0,.45)}
.title{text-align:center;text-transform:uppercase;white-space:normal;color:#fff;letter-spacing:-.5px}
.sel{color:#2f2410;white-space:normal;line-height:33px}
.ink{color:var(--ink);font-weight:900}
.it{font-style:italic;font-weight:700}
.esrb1{font-weight:600}.esrb2{font-weight:600;white-space:normal;line-height:28px;opacity:.92}
.lv{color:#58544c}.lv2{color:#1a1a1f}

.newsbox{position:absolute;inset:0;pointer-events:none}

.ul{position:absolute;left:164px;top:181px;width:150px;height:4px;background:#ffeab0;border-radius:2px}
.tab,.t.tab{color:#fff;text-shadow:0 2px 3px rgba(80,40,0,.4)}
.ttl{font-style:italic;color:#fff;white-space:normal;text-shadow:0 3px 4px rgba(90,45,0,.45)}
.desc{color:#fff;font-weight:700;text-shadow:0 2px 3px rgba(90,45,0,.5)}
.wl{color:rgba(255,240,215,.9);text-shadow:0 1px 2px rgba(80,30,0,.5)}.wn{color:rgba(255,240,215,.95);text-shadow:0 2px 3px rgba(80,30,0,.5)}
.wt{color:#fff;font-style:italic}.live{color:#06180a;font-style:italic}
.endt{color:#ffe9a8;text-align:center;white-space:normal;text-shadow:0 2px 3px #000}
.stitle{font-style:italic;color:#fff;text-shadow:0 3px 4px rgba(0,0,40,.35)}

.chatbox[hidden]{display:none}.chatbox b{color:var(--yellow)}
.chatbox .log{min-height:140px;max-height:200px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.chatbox input{margin-top:8px;height:48px;border:0;border-radius:8px;padding:0 12px;font:600 24px var(--f-ui);background:rgba(255,255,255,.93);color:#111;outline:none}
.bubble{position:absolute;left:1000px;top:700px;z-index:25;background:#fff;color:var(--ink);font:900 46px var(--f-display);padding:10px 30px;border-radius:40px;pointer-events:none;animation:up 1.6s ease-out forwards}
@keyframes up{from{transform:translate(-50%,0)}to{transform:translate(-50%,-110px);opacity:0}}
.bubble{transform:translate(-50%,0)}

<div class="chatbox" id="chat" hidden><div class="log" id="chatlog"></div><input id="chatin" type="text" maxlength="80" autocomplete="off"></div>
</div>
<script>
/* ============== TEXTOS: aquí vive todo el texto de la interfaz (las imágenes no llevan texto) ============== */
window.TEXTS = {
  nav: { vbucks: "200", labels: { lobby: "PLAY", treasure: "TREASURE", shop: "SHOP" } },
  player: { name: "CarlitosTM11", status: "Not Ready", statusReady: "Ready", levelLabel: "LVL", level: "1", partyIndex: "1" },
  mode: { title: "BATTLE ROYALE", selector: "Construcción,\nModo...", cta: "PLAY", sub: "RANK: PENDING" },
  esrb: { rating: "Teen", content: "Violence, Suggestive Themes, Lyrics, Animated Blood", interactive: "Users Interact, In-Game Purchases" },
  news: ["ARSENAL DE LOS SOMBREROS DE PAJA", "OBTÉN EL PASE DE BATALLA", "RECIBE NOTIFICACIONES EN TU DISPOSITIVO MÓVIL", "CAZATESOROS YA ESTÁ DISPONIBLE"],
  treasure: {
    tab: "ADVENTURE", title: "GREATEST ADVENTURE\nOF ALL TIME",
    desc: "Each week introduces new gameplay\nitems, quests, bosses, landmarks, and\nsprites.",
    weekLabel: "WEEK", live: "LIVE", endTitle: "END OF\nCHAPTER EVENT",
    weeks: [{ n: "1" }, { n: "2", time: "3D 1H" }, { n: "3", time: "1W 3D" }, { n: "4", time: "2W 3D" }, { n: "5", time: "3W 3D" }],
    end: { time: "4W 3D" }
  },
  shop: {
    title: "CLUB DE FORTNITE Y PASES",
    club: { name: "CLUB", sub: "DE FORTNITE", caption: "Club de Fortnite", cta: "LEARN MORE", plus: "+" },
    buttons: { creator: "SUPPORT-A-CREATOR: NONE", about: "ABOUT SHOP", select: "SELECT" }
  },
  bar: { chat: "CHAT", emote: "EMOTE", back: "BACK" },
  chat: { placeholder: "Escribe un mensaje...", emotes: ["¡GG!", "¡OLÉ!", "¡TESORO!", "¡VAMOS!", "¡EZ!"] },
  characterImage: ""
};
(function(){
const T=TEXTS,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],st=$("#stage");
const get=p=>p.split(".").reduce((o,k)=>o&&o[k],T);
$$("[data-t]").forEach(el=>{const v=get(el.dataset.t)??"";el.textContent=v;if(String(v).includes("\n")){el.style.whiteSpace="pre"}});
if(T.characterImage){const i=$("#character");i.src=T.characterImage;i.hidden=false}
/* estado Ready */
let ready=false;const status=$('[data-t="player.status"]');
/* navegación entre pantallas */
function go(s){
  document.body.dataset.screen=s;
  $$(".screen").forEach(x=>x.hidden=x.dataset.screen!==s);
  $$("[data-tile]").forEach(x=>x.hidden=x.dataset.tile!==s);
  $$("[data-lab]").forEach(x=>x.hidden=x.dataset.lab!==s);
  $$(".ic.tab").forEach(x=>x.style.visibility=x.dataset.go===s?"hidden":"visible");
  if(s==="lobby")$("#bg").play&&$("#bg").play().catch(()=>{});
}
$$(".ic.tab").forEach(t=>t.addEventListener("pointerdown",e=>{e.preventDefault();go(t.dataset.go)}));
/* acciones */
const chat=$("#chat"),log=$("#chatlog"),inp=$("#chatin");inp.placeholder=T.chat.placeholder;
function say(m){const d=document.createElement("div"),b=document.createElement("b");b.textContent=T.player.name+" ";d.append(b,document.createTextNode(m));log.appendChild(d);while(log.children.length>6)log.firstChild.remove()}
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&inp.value.trim()){say(inp.value.trim());inp.value=""}});
st.addEventListener("pointerdown",e=>{
  const a=e.target.closest("[data-act]");if(a){e.preventDefault();
    if(a.dataset.act==="chat"){chat.hidden=!chat.hidden;if(!chat.hidden)inp.focus()}
    if(a.dataset.act==="emote"){const b=document.createElement("div");b.className="bubble";b.textContent=T.chat.emotes[Math.random()*T.chat.emotes.length|0];st.appendChild(b);setTimeout(()=>b.remove(),1600)}
    if(a.dataset.act==="ready"){ready=!ready;status.textContent=ready?T.player.statusReady:T.player.status}
    return}
  const c=e.target.closest("[data-card]");if(c){$$("[data-card]").forEach(x=>x.dataset.sel="");c.dataset.sel="1"}
});
/* noticias */
const nimgs=$$(".news"),nt=$("#newstext"),dots=$("#dots");let ni=0;
nimgs.forEach(()=>dots.appendChild(document.createElement("span")));
function showNews(i){nimgs.forEach((n,j)=>n.classList.toggle("on",j===i));nt.textContent=T.news[i];[...dots.children].forEach((d,j)=>d.classList.toggle("on",j===i))}
showNews(0);setInterval(()=>{ni=(ni+1)%nimgs.length;showNews(ni)},3000);
/* escala */
function fit(){const s=Math.min(innerWidth/2000,innerHeight/921);st.style.transform="translate(-50%,-50%) scale("+s+")"}
addEventListener("resize",fit);fit();
go("lobby");const h=location.hash.slice(1);if(["lobby","treasure","shop"].includes(h))go(h);
})();
</script></body></html>
