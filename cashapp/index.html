.toastwrap{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;justify-content:center;z-index:90;pointer-events:none}

.toast.show{opacity:1;transform:translateY(0)}

</style>

<body>

<script>
(function(){
function AH(){var h=innerHeight;try{var sa=navigator.standalone===true||(matchMedia&&matchMedia('(display-mode: standalone)').matches);if(sa&&innerHeight>innerWidth)h=Math.max(h,screen.height||0,(visualViewport&&visualViewport.height)||0)}catch(e){}document.documentElement.style.setProperty('--app-h',h+'px');return h}
AH();
addEventListener('resize',AH);
addEventListener('orientationchange',AH);
addEventListener('pageshow',AH);
if(window.visualViewport)visualViewport.addEventListener('resize',AH);
[50,200,600,1500].forEach(function(t){setTimeout(AH,t)});
document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});
document.addEventListener('gesturechange',function(e){e.preventDefault()},{passive:false});
document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});
var lastTouchEnd=0;
document.addEventListener('touchend',function(e){var now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now},{passive:false});

var amt=document.getElementById('amt'),dock=document.getElementById('dock');
var digits=document.getElementById('digits');
var cashtag=document.getElementById('cashtag');
var savings=document.getElementById('savings');
var avatar=document.getElementById('avatar'),sheetavatar=document.getElementById('sheetavatar'),avatarfile=document.getElementById('avatarfile');

var bal=54.20,sav=0,cardDigits='9427',tag='jwr2239',avatarUrl=null;
try{var s1=localStorage.getItem('cashapp_balance');if(s1!==null&&!isNaN(parseFloat(s1)))bal=parseFloat(s1)}catch(e){}
try{var s0=localStorage.getItem('cashapp_savings');if(s0!==null&&!isNaN(parseFloat(s0)))sav=parseFloat(s0)}catch(e){}
try{var s2=localStorage.getItem('cashapp_card_digits');if(s2&&/^\d{4}$/.test(s2))cardDigits=s2}catch(e){}
try{var s3=localStorage.getItem('cashapp_cashtag');if(s3)tag=s3}catch(e){}
try{var s4=localStorage.getItem('cashapp_avatar');if(s4)avatarUrl=s4}catch(e){}

var ui=document.getElementById('ui'),dockbar=document.querySelector('.dockbar');
function fitText(el,containerEl,baseFrac,maxWidthFrac){
  var cw=containerEl.getBoundingClientRect().width;
  if(!cw)return;
  var fontPx=cw*baseFrac;
  el.style.fontSize=fontPx+'px';
  var tw=el.getBoundingClientRect().width;
  var maxW=cw*maxWidthFrac;
  if(tw>maxW){
    el.style.fontSize=(fontPx*(maxW/tw))+'px';
  }
}
function renderAll(){
  amt.textContent='$'+bal.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  dock.textContent='$'+Math.round(bal).toLocaleString('en-US');
  savings.textContent='$'+sav.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  digits.textContent=cardDigits;
  cashtag.textContent='$'+tag;
  if(avatarUrl){avatar.style.backgroundImage='url('+avatarUrl+')';sheetavatar.style.backgroundImage='url('+avatarUrl+')'}
  fitText(amt,ui,.149,.90);
  fitText(dock,dockbar,.094,.28);
  fitText(savings,ui,.0926,.82);
}
renderAll();
addEventListener('resize',renderAll);
addEventListener('orientationchange',renderAll);

var hitadd=document.getElementById('hitadd'),sheetwrap=document.getElementById('sheetwrap'),dim=document.getElementById('dim'),closebtn=document.getElementById('closebtn'),savebtn=document.getElementById('savebtn');
var pbal=document.getElementById('pbal'),psav=document.getElementById('psav'),pdigits=document.getElementById('pdigits'),ptag=document.getElementById('ptag');

function openSheet(){
  pbal.value=bal.toFixed(2);
  psav.value=sav.toFixed(2);
  pdigits.value=cardDigits;
  ptag.value=tag;
  sheetwrap.hidden=false;
}
function closeSheet(){sheetwrap.hidden=true}

function save(){
  var n=parseFloat(pbal.value);
  if(!isNaN(n)&&n>=0)bal=Math.round(n*100)/100;
  var ns=parseFloat(psav.value);
  if(!isNaN(ns)&&ns>=0)sav=Math.round(ns*100)/100;
  var d=pdigits.value.replace(/\D/g,'').slice(0,4);
  if(d.length===4)cardDigits=d;
  var t=ptag.value.replace(/^\$+/,'').replace(/[^a-zA-Z0-9]/g,'').slice(0,20);
  if(t)tag=t;
  renderAll();
  try{
    localStorage.setItem('cashapp_balance',bal);
    localStorage.setItem('cashapp_savings',sav);
    localStorage.setItem('cashapp_card_digits',cardDigits);
    localStorage.setItem('cashapp_cashtag',tag);
  }catch(e){}
  closeSheet();
}

hitadd.addEventListener('click',openSheet);
dim.addEventListener('click',closeSheet);
closebtn.addEventListener('click',closeSheet);
savebtn.addEventListener('click',save);

document.getElementById('sheetavatarbtn').addEventListener('click',function(){avatarfile.click()});
avatarfile.addEventListener('change',function(){
  var f=avatarfile.files&&avatarfile.files[0];
  if(!f)return;
  var reader=new FileReader();
  reader.onload=function(){
    avatarUrl=reader.result;
    sheetavatar.style.backgroundImage='url('+avatarUrl+')';
    avatar.style.backgroundImage='url('+avatarUrl+')';
    try{localStorage.setItem('cashapp_avatar',avatarUrl)}catch(e){}
  };
  reader.readAsDataURL(f);
});

/* ---- Pay / Request flow ---- */
var AVATAR_COLORS=['#ff5fa2','#3ddc97','#5b8cff','#ffb23f','#9a7bff','#ff7a5f','#2fd1c5','#5fd0ff'];

var paypage=document.getElementById('paypage'),payamt=document.getElementById('payamt'),paynote=document.getElementById('paynote');
var payclose=document.getElementById('payclose'),payavatar=document.getElementById('payavatar'),dockhit=document.getElementById('dockhit');
var paybtn=document.getElementById('paybtn'),poolbtn=document.getElementById('poolbtn'),requestbtn=document.getElementById('requestbtn');
var paykeys=document.getElementById('paykeys');
var contactwrap=document.getElementById('contactwrap'),cdim=document.getElementById('cdim'),cxbtn=document.getElementById('cxbtn');
var csearchinput=document.getElementById('csearchinput'),clist=document.getElementById('clist'),cresultslabel=document.getElementById('cresultslabel');
var ctitlemode=document.getElementById('ctitlemode'),ctitleamt=document.getElementById('ctitleamt'),ctitleto=document.getElementById('ctitleto');
var toast=document.getElementById('toast'),toasttext=document.getElementById('toasttext');

var payBuf='';
var payMode='pay'; // 'pay' or 'request'

function payAmount(){ return parseFloat(payBuf||'0')||0 }
function withCommas(s){
  var parts=String(s).split('.');
  parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return parts.join('.');
}
function renderPay(){
  var n=payAmount();
  payamt.textContent='$'+withCommas((payBuf?payBuf:'0').replace(/^0+(?=\d)/,''));
  paybtn.disabled = !(n>0);
  if(n>bal && payMode==='pay'){ paynote.textContent='Not enough money'; paybtn.disabled=true; }
  else { paynote.textContent=' '; }
  if(avatarUrl) payavatar.style.backgroundImage='url('+avatarUrl+')';
}

function openPayPage(){
  payBuf='';
  payMode='pay';
  renderPay();
  paypage.classList.add('open');
}
function closePayPage(){ paypage.classList.remove('open') }

dockhit.addEventListener('click',openPayPage);
payclose.addEventListener('click',closePayPage);

paykeys.addEventListener('click',function(e){
  var btn=e.target.closest('.paykey');
  if(!btn)return;
  var k=btn.dataset.k;
  if(k==='back'){ payBuf=payBuf.slice(0,-1); }
  else if(k==='.'){ if(payBuf.indexOf('.')===-1) payBuf=(payBuf||'0')+'.'; }
  else {
    var dot=payBuf.indexOf('.');
    if(dot!==-1 && payBuf.length-dot>2) return; // max 2 decimals
    if(payBuf.replace('.','').length>=7) return; // sane max length
    payBuf+=k;
  }
  renderPay();
});

function openContactSheet(mode){
  payMode=mode;
  ctitlemode.textContent = mode==='pay' ? 'Pay' : 'Request';
  ctitleamt.textContent = '$'+withCommas(payAmount().toFixed(payAmount()%1?2:0));
  ctitleto.textContent = mode==='pay' ? 'to' : 'from';
  csearchinput.value='';
  renderContacts('');
  contactwrap.hidden=false;
}
function closeContactSheet(){ contactwrap.hidden=true }

paybtn.addEventListener('click',function(){ if(!paybtn.disabled) openContactSheet('pay') });
requestbtn.addEventListener('click',function(){ if(payAmount()>0) openContactSheet('request'); else { payBuf='1'; renderPay(); openContactSheet('request'); } });
poolbtn.addEventListener('click',function(){ showToast('Pools are coming soon') });

cdim.addEventListener('click',closeContactSheet);
cxbtn.addEventListener('click',closeContactSheet);

// Synthesizes a small list of plausible results from whatever was typed —
// same no-API trick as paypal/index.html's search(), extended to look like
// real Cash App results: several unrelated-looking names whose $cashtag
// just happens to contain the query, some marked as business accounts.
// Nothing here is a real person or business — it's all generated from the
// query text with a seeded PRNG so the same search always looks the same.
var FIRSTNAMES=['Alex','Jordan','Maria','Chris','Sam','Taylor','Jamie','Morgan','Casey','Riley','Avery','Drew','Dana','Reese','Quinn','Skyler','Nico','Ariel','Blake','Rowan','Devon','Logan'];
var LASTNAMES=['Rivera','Blake','Lopez','Webb','Castillo','Nguyen','Walsh','Reyes','Patel','Chen','Flores','Hayes','Diaz','Cole','Fisher','Ward','Brooks','Vega','Hart','Price'];
var BIZPREFIX=['Blue','Sunset','Golden','Little','North','Silver','Green','Urban','Wild','Honey','Maple','Coastal','Cedar','Amber'];
var BIZWORDS=['Bakery','Studio','Market','Design','Goods','Press','Supply','Kitchen','Garden','Collective','Co','Boutique'];
var TAGFRAGS=['co','shop','store','hub','world','plus','official','go'];
function seededRand(seed){
  var s=seed%2147483647; if(s<=0) s+=2147483646;
  return function(){ s=s*16807%2147483647; return (s-1)/2147483646; };
}
function pick(arr,rand){ return arr[Math.floor(rand()*arr.length)] }
function genResults(q){
  var s=q.replace(/^\$/,'').trim();
  var letters=s.replace(/[^a-zA-Z]/g,'').toLowerCase();
  if(letters.length<2) return [];
  var seed=0; for(var i=0;i<s.length;i++) seed+=s.charCodeAt(i)*(i*31+7);
  var rand=seededRand(seed||1);
  var words=s.replace(/[^a-zA-Z ]/g,' ').trim().split(/\s+/).filter(Boolean);
  var cleanName=words.length?words.map(function(w){return w[0].toUpperCase()+w.slice(1).toLowerCase()}).join(' '):letters.charAt(0).toUpperCase()+letters.slice(1);
  var out=[{name:cleanName,tag:letters,biz:false}];
  var used={}; used[letters]=1;
  var n=2+Math.floor(rand()*3);
  for(var k=0;k<n;k++){
    var biz=rand()<0.35;
    var name=biz?(pick(BIZPREFIX,rand)+' '+pick(BIZWORDS,rand)):(pick(FIRSTNAMES,rand)+' '+pick(LASTNAMES,rand));
    var pos=rand(), frag=pick(TAGFRAGS,rand), num=Math.floor(rand()*90+10);
    var tag = pos<.4 ? (letters+frag+num) : pos<.7 ? (frag+letters+num) : (letters+num);
    tag=tag.toLowerCase().replace(/[^a-z0-9]/g,'');
    if(used[tag]) continue;
    used[tag]=1;
    out.push({name:name,tag:tag,biz:biz});
  }
  return out;
}
var searchTimer=null,searchTimer2=null;
function renderContacts(q){
  var v=(q||'').trim();
  clearTimeout(searchTimer);clearTimeout(searchTimer2);
  cresultslabel.hidden=true;
  if(!v){ clist.innerHTML=''; return }
  clist.innerHTML='<div class="cspinwrap"><i class="cspin"></i></div>';
  searchTimer=setTimeout(function(){
    searchTimer2=setTimeout(function(){
      var results=genResults(v);
      if(!results.length){ clist.innerHTML='<div class="cempty">No results</div>'; return }
      cresultslabel.hidden=false;
      clist.innerHTML=results.map(function(r,i){
        var initial=(r.name.split(' ').length>1?r.name.split(' ')[0][0]+r.name.split(' ')[1][0]:r.name.slice(0,2)).toUpperCase();
        var color=AVATAR_COLORS[r.tag.length%AVATAR_COLORS.length];
        return '<div class="crow" data-tag="'+r.tag+'" data-name="'+r.name+'" style="animation-delay:'+(i*45)+'ms">'+
          '<div class="cav" style="background:'+color+'">'+initial+'</div>'+
          '<div class="cmeta"><div class="cname">'+r.name+(r.biz?' <svg class="cbiz" viewBox="0 0 24 24" fill="currentColor"><path d="M9 4a2 2 0 0 0-2 2v1H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3V6a2 2 0 0 0-2-2H9zm0 2h6v1H9V6zM4 9h16v9H4V9z"/></svg>':'')+'</div><div class="ctag">$'+r.tag+'</div></div>'+
        '</div>';
      }).join('');
    },700);
  },500);
}
csearchinput.addEventListener('input',function(){
  csearchinput.classList.toggle('has-text',csearchinput.value!=='');
  renderContacts(csearchinput.value);
});

clist.addEventListener('click',function(e){
  var row=e.target.closest('.crow');
  if(!row)return;
  var n=payAmount();
  var who=row.dataset.name;
  closeContactSheet();
  closePayPage();
  if(payMode==='pay'){
    bal=Math.max(0,Math.round((bal-n)*100)/100);
    renderAll();
    try{localStorage.setItem('cashapp_balance',bal)}catch(e){}
    showToast('Sent $'+n.toFixed(2)+' to '+who);
  } else {
    showToast('Requested $'+n.toFixed(2)+' from '+who);
  }
});

var toastTimer=null;
function showToast(msg){
  toasttext.textContent=msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ toast.classList.remove('show') },2600);
}
})();
