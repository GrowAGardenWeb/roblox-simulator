<body>

<button class="payhit kavatar" id="kavatar" aria-label="Edit account"></button>

  <div class="grabber"></div>
  <div class="paysheethead"><button class="closebtn" id="payclosebtn">&#10005;</button></div>
  <div style="font-size:28px;font-weight:800;margin-bottom:16px">Pay <span id="paysheetamt" style="color:#8e8e93">$0</span> to</div>
  <div class="paysearch">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="payq" placeholder="Name, $cashtag, email, phone">
  </div>
  <div class="paylist" id="paylist"></div>
</div>

<script>
(function(){
function AH(){var h=innerHeight;try{var sa=navigator.standalone===true||(matchMedia&&matchMedia('(display-mode: standalone)').matches);if(sa&&innerHeight>innerWidth)h=Math.max(h,screen.height||0,(visualViewport&&visualViewport.height)||0)}catch(e){}document.documentElement.style.setProperty('--app-h',h+'px');return h}
AH();
addEventListener('resize',AH);
addEventListener('orientationchange',AH);
addEventListener('pageshow',AH);
if(window.visualViewport)visualViewport.addEventListener('resize',AH);
[50,200,600,1500].forEach(function(t){setTimeout(AH,t)});
document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});
document.addEventListener('gesturechange',function(e){e.preventDefault()},{passive:false});
document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});
var lastTouchEnd=0;
document.addEventListener('touchend',function(e){var now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now},{passive:false});

var amt=document.getElementById('amt'),dock=document.getElementById('dock');
var digits=document.getElementById('digits');
var cashtag=document.getElementById('cashtag');
var savings=document.getElementById('savings');
var avatar=document.getElementById('avatar'),sheetavatar=document.getElementById('sheetavatar'),avatarfile=document.getElementById('avatarfile');

var bal=54.20,sav=0,cardDigits='9427',tag='jwr2239',avatarUrl=null;
try{var s1=localStorage.getItem('cashapp_balance');if(s1!==null&&!isNaN(parseFloat(s1)))bal=parseFloat(s1)}catch(e){}
try{var s0=localStorage.getItem('cashapp_savings');if(s0!==null&&!isNaN(parseFloat(s0)))sav=parseFloat(s0)}catch(e){}
try{var s2=localStorage.getItem('cashapp_card_digits');if(s2&&/^\d{4}$/.test(s2))cardDigits=s2}catch(e){}
try{var s3=localStorage.getItem('cashapp_cashtag');if(s3)tag=s3}catch(e){}
try{var s4=localStorage.getItem('cashapp_avatar');if(s4)avatarUrl=s4}catch(e){}

var ui=document.getElementById('ui'),dockbar=document.querySelector('.dockbar');
function fitText(el,containerEl,baseFrac,maxWidthFrac){
  var cw=containerEl.getBoundingClientRect().width;
  if(!cw)return;
  var fontPx=cw*baseFrac;
  el.style.fontSize=fontPx+'px';
  var tw=el.getBoundingClientRect().width;
  var maxW=cw*maxWidthFrac;
  if(tw>maxW){
    el.style.fontSize=(fontPx*(maxW/tw))+'px';
  }
}
function renderAll(){
  amt.textContent='$'+bal.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  dock.textContent='$'+Math.round(bal).toLocaleString('en-US');
  savings.textContent='$'+sav.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  digits.textContent=cardDigits;
  cashtag.textContent='$'+tag;
  if(avatarUrl){avatar.style.backgroundImage='url('+avatarUrl+')';sheetavatar.style.backgroundImage='url('+avatarUrl+')'}
  fitText(amt,ui,.149,.90);
  fitText(dock,dockbar,.094,.28);
  fitText(savings,ui,.0926,.82);
}
renderAll();
addEventListener('resize',renderAll);
addEventListener('orientationchange',renderAll);

var hitadd=document.getElementById('hitadd'),sheetwrap=document.getElementById('sheetwrap'),dim=document.getElementById('dim'),closebtn=document.getElementById('closebtn'),savebtn=document.getElementById('savebtn');
var pbal=document.getElementById('pbal'),psav=document.getElementById('psav'),pdigits=document.getElementById('pdigits'),ptag=document.getElementById('ptag');

function openSheet(){
  pbal.value=bal.toFixed(2);
  psav.value=sav.toFixed(2);
  pdigits.value=cardDigits;
  ptag.value=tag;
  sheetwrap.hidden=false;
}
function closeSheet(){sheetwrap.hidden=true}

function save(){
  var n=parseFloat(pbal.value);
  if(!isNaN(n)&&n>=0)bal=Math.round(n*100)/100;
  var ns=parseFloat(psav.value);
  if(!isNaN(ns)&&ns>=0)sav=Math.round(ns*100)/100;
  var d=pdigits.value.replace(/\D/g,'').slice(0,4);
  if(d.length===4)cardDigits=d;
  var t=ptag.value.replace(/^\$+/,'').replace(/[^a-zA-Z0-9]/g,'').slice(0,20);
  if(t)tag=t;
  renderAll();
  try{
    localStorage.setItem('cashapp_balance',bal);
    localStorage.setItem('cashapp_savings',sav);
    localStorage.setItem('cashapp_card_digits',cardDigits);
    localStorage.setItem('cashapp_cashtag',tag);
  }catch(e){}
  closeSheet();
}

hitadd.addEventListener('click',openSheet);
dim.addEventListener('click',closeSheet);
closebtn.addEventListener('click',closeSheet);
savebtn.addEventListener('click',save);

document.getElementById('sheetavatarbtn').addEventListener('click',function(){avatarfile.click()});
avatarfile.addEventListener('change',function(){
  var f=avatarfile.files&&avatarfile.files[0];
  if(!f)return;
  var reader=new FileReader();
  reader.onload=function(){
    avatarUrl=reader.result;
    sheetavatar.style.backgroundImage='url('+avatarUrl+')';
    avatar.style.backgroundImage='url('+avatarUrl+')';
    var pa=document.getElementById('payavatar');if(pa)pa.style.backgroundImage='url('+avatarUrl+')';
    try{localStorage.setItem('cashapp_avatar',avatarUrl)}catch(e){}
  };
  reader.readAsDataURL(f);
});

var wrap=document.querySelector('.wrap'),paywrap=document.getElementById('paywrap');
var payui=document.getElementById('payui'),payamt=document.getElementById('payamt'),payavatar=document.getElementById('payavatar');
var godock=document.getElementById('godock'),kdollar=document.getElementById('kdollar');
function syncPayAvatar(){if(avatarUrl)payavatar.style.backgroundImage='url('+avatarUrl+')'}
function goPay(){wrap.hidden=true;paywrap.hidden=false;syncPayAvatar();fitPayAmt()}
function goMoney(){paywrap.hidden=true;wrap.hidden=false}
godock.addEventListener('click',goPay);
kdollar.addEventListener('click',goMoney);
document.getElementById('kavatar').addEventListener('click',openSheet);

var payVal='';
function fitPayAmt(){fitText(payamt,payui,.242,.90)}
function renderPayAmt(){
  payamt.textContent='$'+(payVal||'0');
  fitPayAmt();
}
renderPayAmt();
document.querySelectorAll('.payhit[data-k]').forEach(function(btn){
  btn.addEventListener('click',function(){
    var k=btn.dataset.k;
    if(k==='.'){
      if(payVal.indexOf('.')<0)payVal=(payVal||'0')+'.';
    }else{
      if(payVal.indexOf('.')>=0&&payVal.split('.')[1].length>=2)return;
      if(payVal==='0')payVal=k;else payVal=(payVal||'')+k;
    }
    renderPayAmt();
  });
});
document.getElementById('kback').addEventListener('click',function(){
  payVal=payVal.slice(0,-1);
  renderPayAmt();
});

var contactPool=[
  {name:'Jordan Diaz',tag:'jordand',av:'J',color:'#ff8fd6'},
  {name:'Jamie Lee',tag:'jamielee',av:'J',color:'#ff8fd6'},
  {name:'Hana Kim',tag:'hanak',av:'H',color:'#63e6c4'},
  {name:'Marcus Reed',tag:'marcusr',av:'M',color:'#74c0fc'},
  {name:'Priya Patel',tag:'priyap',av:'P',color:'#ffa94d'},
  {name:'My Phan',tag:'hellomya63',av:'M',color:'#74c0fc'},
  {name:'Hello Sunshine Butterfly',tag:'hellosunshinecookies',av:'H',color:'#ffd43b'},
  {name:'SNUG',tag:'HellaMotion29',av:'S',color:'#b197fc'},
  {name:'Alishia Givens',tag:'hellosweetsbakeshop',av:'A',color:'#ff8fd6'},
  {name:'Chris Nguyen',tag:'chrisn',av:'C',color:'#74c0fc'},
  {name:'Destiny Brooks',tag:'destinyb',av:'D',color:'#d0a9ff'},
  {name:'Alex Turner',tag:'alext',av:'A',color:'#ff8fd6'}
];
var paylist=document.getElementById('paylist'),payq=document.getElementById('payq');
function rowHtml(c){
  return '<div class="payrow"><div class="payav" style="background:'+c.color+'">'+c.av+'</div><div><b>'+c.name+'</b><small>$'+c.tag+'</small></div></div>';
}
function renderList(){
  var v=payq.value.trim().toLowerCase();
  if(!v){
    paylist.innerHTML=contactPool.slice(0,5).map(rowHtml).join('');
    return;
  }
  var matches=contactPool.filter(function(c){
    return c.name.toLowerCase().indexOf(v)>=0||c.tag.toLowerCase().indexOf(v)>=0;
  });
  var html='<div class="paylisthead">Results</div>';
  html+=matches.length?matches.map(rowHtml).join(''):'<div class="paylisthead">No results</div>';
  paylist.innerHTML=html;
}
payq.addEventListener('input',renderList);
paylist.addEventListener('click',function(e){
  if(e.target.closest('.payrow'))closePaySheet();
});

var paysheetwrap=document.getElementById('paysheetwrap'),paydim=document.getElementById('paydim'),payclosebtn=document.getElementById('payclosebtn'),paysheetamt=document.getElementById('paysheetamt');
function openPaySheet(){
  paysheetamt.textContent='$'+Math.round(parseFloat(payVal||'0'));
  payq.value='';
  renderList();
  paysheetwrap.hidden=false;
}
function closePaySheet(){paysheetwrap.hidden=true}
document.getElementById('kpay').addEventListener('click',openPaySheet);
paydim.addEventListener('click',closePaySheet);
payclosebtn.addEventListener('click',closePaySheet);
})();
</script>
</body></html>
