<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<script>(function(){var h=innerHeight;try{var sa=navigator.standalone===true||(matchMedia&&matchMedia("(display-mode: standalone)").matches);if(sa&&innerHeight>innerWidth)h=Math.max(h,screen.height||0,(visualViewport&&visualViewport.height)||0)}catch(e){}document.documentElement.style.setProperty("--app-h",h+"px")})()</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cash App">
<meta name="theme-color" content="#000000">
<title>Money</title>
<style>
html,body{height:var(--app-h,100%);overflow:hidden;margin:0;background:#000;touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior:none}
.wrap{position:fixed;top:0;left:0;right:0;height:var(--app-h,100%);margin:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ui{position:relative;width:100%;max-width:620px;aspect-ratio:1320/2868;flex:none;overflow:hidden;background:center/100% 100% no-repeat url(money.png)}
</style>
</head>
<body>
<div class="wrap"><div class="ui"></div></div>
<script>
(function(){
function AH(){var h=innerHeight;try{var sa=navigator.standalone===true||(matchMedia&&matchMedia('(display-mode: standalone)').matches);if(sa&&innerHeight>innerWidth)h=Math.max(h,screen.height||0,(visualViewport&&visualViewport.height)||0)}catch(e){}document.documentElement.style.setProperty('--app-h',h+'px');return h}
AH();
addEventListener('resize',AH);
addEventListener('orientationchange',AH);
addEventListener('pageshow',AH);
if(window.visualViewport)visualViewport.addEventListener('resize',AH);
[50,200,600,1500].forEach(function(t){setTimeout(AH,t)});
document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});
document.addEventListener('gesturechange',function(e){e.preventDefault()},{passive:false});
document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});
var lastTouchEnd=0;
document.addEventListener('touchend',function(e){var now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now},{passive:false});
})();
</script>
</body></html>
