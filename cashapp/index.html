<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<script>(function(){var h=innerHeight;try{var sa=navigator.standalone===true||(matchMedia&&matchMedia("(display-mode: standalone)").matches);if(sa&&innerHeight>innerWidth)h=Math.max(h,screen.height||0,(visualViewport&&visualViewport.height)||0)}catch(e){}document.documentElement.style.setProperty("--app-h",h+"px")})()</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cash App">
<meta name="theme-color" content="#000000">
<title>Money</title>
<style>
html,body{height:var(--app-h,100%);overflow:hidden;margin:0;background:#000;touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior:none}
.wrap{position:fixed;top:0;left:0;right:0;height:var(--app-h,100%);margin:0;overflow:hidden;display:flex;justify-content:center}
.scroll{width:100%;max-width:620px;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.ui{position:relative;width:100%;aspect-ratio:1320/4560;container-type:inline-size;background:top/100% 100% no-repeat url(money.png)}
.amt{position:absolute;left:5.45%;top:19.76%;transform:translateY(-50%);font-family:"Helvetica Neue",Arial,sans-serif;font-weight:800;color:#fff;font-size:14.9cqw;line-height:1;white-space:nowrap;-webkit-user-select:none;user-select:none;cursor:pointer}
.amt.editing{-webkit-user-select:text;user-select:text}
.amtin{position:absolute;left:5.45%;top:19.76%;transform:translateY(-50%);font-family:"Helvetica Neue",Arial,sans-serif;font-weight:800;color:#fff;font-size:14.9cqw;line-height:1;background:transparent;border:0;outline:0;padding:0;width:70%;display:none}
.amt.hold{opacity:.45;transition:opacity 3s linear}
.digits{position:absolute;left:18.64%;top:12.24%;transform:translateY(-50%);font-family:"Helvetica Neue",Arial,sans-serif;font-weight:600;color:#1c1c1e;font-size:3.1cqw;line-height:1;white-space:nowrap;cursor:pointer}
.digitsin{position:absolute;left:18.64%;top:12.24%;transform:translateY(-50%);font-family:"Helvetica Neue",Arial,sans-serif;font-weight:600;color:#1c1c1e;font-size:3.1cqw;line-height:1;background:transparent;border:0;outline:0;padding:0;width:16%;display:none}
.cashtag{position:absolute;right:5.3%;top:12.37%;transform:translateY(-50%);font-family:"Helvetica Neue",Arial,sans-serif;font-weight:400;color:#5b5b5e;font-size:4.3cqw;line-height:1;white-space:nowrap;cursor:pointer;text-align:right}
.cashtagin{position:absolute;right:5.3%;top:12.37%;transform:translateY(-50%);font-family:"Helvetica Neue",Arial,sans-serif;font-weight:400;color:#5b5b5e;font-size:4.3cqw;line-height:1;background:transparent;border:0;outline:0;padding:0;width:40%;text-align:right;display:none}
.digits.hold,.cashtag.hold{opacity:.45;transition:opacity 3s linear}
.avatar{position:absolute;left:91.36%;top:6.19%;width:11.52cqw;height:11.52cqw;transform:translate(-50%,-50%);border-radius:50%;background:#2c2c2e center/cover no-repeat;cursor:pointer}
.avatarfile{display:none}
.dockoverlay{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:100%;max-width:620px;display:flex;justify-content:center;pointer-events:none}
.dockbar{position:relative;width:61.82%;aspect-ratio:816/186;container-type:inline-size;background:center/100% 100% no-repeat url(dock.png);pointer-events:auto}
.dock{position:absolute;left:15.99%;top:51.6%;transform:translate(-50%,-50%);font-family:"Helvetica Neue",Arial,sans-serif;font-weight:700;color:#fff;font-size:9.4cqw;line-height:1;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<div class="wrap"><div class="scroll"><div class="ui" id="ui">
<span class="amt" id="amt">$54.20</span>
<input class="amtin" id="amtin" inputmode="decimal">
<span class="digits" id="digits">9427</span>
<input class="digitsin" id="digitsin" inputmode="numeric" maxlength="4">
<span class="cashtag" id="cashtag">$jwr2239</span>
<input class="cashtagin" id="cashtagin">
<div class="avatar" id="avatar"></div>
<input type="file" accept="image/*" class="avatarfile" id="avatarfile">
</div></div>
<div class="dockoverlay"><div class="dockbar"><span class="dock" id="dock">$54</span></div></div>
</div>
<script>
(function(){
function AH(){var h=innerHeight;try{var sa=navigator.standalone===true||(matchMedia&&matchMedia('(display-mode: standalone)').matches);if(sa&&innerHeight>innerWidth)h=Math.max(h,screen.height||0,(visualViewport&&visualViewport.height)||0)}catch(e){}document.documentElement.style.setProperty('--app-h',h+'px');return h}
AH();
addEventListener('resize',AH);
addEventListener('orientationchange',AH);
addEventListener('pageshow',AH);
if(window.visualViewport)visualViewport.addEventListener('resize',AH);
[50,200,600,1500].forEach(function(t){setTimeout(AH,t)});
document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});
document.addEventListener('gesturechange',function(e){e.preventDefault()},{passive:false});
document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});
var lastTouchEnd=0;
document.addEventListener('touchend',function(e){var now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now},{passive:false});

function holdToEdit(display,input,opts){
  var holdTimer=null;
  function startHold(){
    cancelHold();
    display.classList.add('hold');
    holdTimer=setTimeout(function(){
      display.classList.remove('hold');
      input.value=opts.toInput();
      display.style.display='none';
      input.style.display='block';
      input.focus();
      input.select();
    },3000);
  }
  function cancelHold(){
    if(holdTimer){clearTimeout(holdTimer);holdTimer=null}
    display.classList.remove('hold');
  }
  function commit(){
    opts.fromInput(input.value);
    input.style.display='none';
    display.style.display='';
  }
  display.addEventListener('pointerdown',startHold);
  display.addEventListener('pointerup',cancelHold);
  display.addEventListener('pointerleave',cancelHold);
  display.addEventListener('pointercancel',cancelHold);
  input.addEventListener('blur',commit);
  input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();input.blur()}});
}

var amt=document.getElementById('amt'),amtin=document.getElementById('amtin'),dock=document.getElementById('dock');
var bal=54.20;
try{var saved=localStorage.getItem('cashapp_balance');if(saved!==null&&!isNaN(parseFloat(saved)))bal=parseFloat(saved)}catch(e){}
function renderBal(){amt.textContent='$'+bal.toFixed(2);dock.textContent='$'+Math.round(bal)}
renderBal();
holdToEdit(amt,amtin,{
  toInput:function(){return bal.toFixed(2)},
  fromInput:function(v){
    var n=parseFloat(v);
    if(!isNaN(n)&&n>=0)bal=Math.round(n*100)/100;
    renderBal();
    try{localStorage.setItem('cashapp_balance',bal)}catch(e){}
  }
});

var digits=document.getElementById('digits'),digitsin=document.getElementById('digitsin');
var cardDigits='9427';
try{var sd=localStorage.getItem('cashapp_card_digits');if(sd&&/^\d{4}$/.test(sd))cardDigits=sd}catch(e){}
digits.textContent=cardDigits;
holdToEdit(digits,digitsin,{
  toInput:function(){return cardDigits},
  fromInput:function(v){
    var d=v.replace(/\D/g,'').slice(0,4);
    if(d.length===4){cardDigits=d}
    digits.textContent=cardDigits;
    try{localStorage.setItem('cashapp_card_digits',cardDigits)}catch(e){}
  }
});

var cashtag=document.getElementById('cashtag'),cashtagin=document.getElementById('cashtagin');
var tag='jwr2239';
try{var st=localStorage.getItem('cashapp_cashtag');if(st)tag=st}catch(e){}
cashtag.textContent='$'+tag;
holdToEdit(cashtag,cashtagin,{
  toInput:function(){return tag},
  fromInput:function(v){
    var t=v.replace(/^\$+/,'').replace(/[^a-zA-Z0-9]/g,'').slice(0,20);
    if(t)tag=t;
    cashtag.textContent='$'+tag;
    try{localStorage.setItem('cashapp_cashtag',tag)}catch(e){}
  }
});

var avatar=document.getElementById('avatar'),avatarfile=document.getElementById('avatarfile');
try{var av=localStorage.getItem('cashapp_avatar');if(av)avatar.style.backgroundImage='url('+av+')'}catch(e){}
avatar.addEventListener('click',function(){avatarfile.click()});
avatarfile.addEventListener('change',function(){
  var f=avatarfile.files&&avatarfile.files[0];
  if(!f)return;
  var reader=new FileReader();
  reader.onload=function(){
    avatar.style.backgroundImage='url('+reader.result+')';
    try{localStorage.setItem('cashapp_avatar',reader.result)}catch(e){}
  };
  reader.readAsDataURL(f);
});
})();
</script>
</body></html>
