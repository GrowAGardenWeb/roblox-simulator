<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<script>(function(){var h=innerHeight;try{var sa=navigator.standalone===true||(matchMedia&&matchMedia("(display-mode: standalone)").matches);if(sa&&innerHeight>innerWidth)h=Math.max(h,screen.height||0,(visualViewport&&visualViewport.height)||0)}catch(e){}document.documentElement.style.setProperty("--app-h",h+"px")})()</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cash App">
<meta name="theme-color" content="#000000">
<title>Money</title>
<style>
html,body{height:var(--app-h,100%);overflow:hidden;margin:0;background:#000;touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior:none}
.wrap{position:fixed;top:0;left:0;right:0;height:var(--app-h,100%);margin:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ui{position:relative;width:100%;max-width:620px;aspect-ratio:1320/2868;flex:none;overflow:hidden;container-type:inline-size;background:center/100% 100% no-repeat url(money.png)}
.amt{position:absolute;left:5.45%;top:31.42%;transform:translateY(-50%);font-family:"Helvetica Neue",Arial,sans-serif;font-weight:800;color:#fff;font-size:14.9cqw;line-height:1;white-space:nowrap;-webkit-user-select:none;user-select:none;cursor:pointer}
.amt.editing{-webkit-user-select:text;user-select:text}
.dock{position:absolute;left:28.98%;top:79.71%;transform:translate(-50%,-50%);font-family:"Helvetica Neue",Arial,sans-serif;font-weight:700;color:#fff;font-size:5.83cqw;line-height:1;white-space:nowrap;pointer-events:none}
.amtin{position:absolute;left:5.45%;top:31.42%;transform:translateY(-50%);font-family:"Helvetica Neue",Arial,sans-serif;font-weight:800;color:#fff;font-size:14.9cqw;line-height:1;background:transparent;border:0;outline:0;padding:0;width:70%;display:none}
.amt.hold{opacity:.45;transition:opacity 3s linear}
</style>
</head>
<body>
<div class="wrap"><div class="ui" id="ui">
<span class="amt" id="amt">$54.20</span>
<input class="amtin" id="amtin" inputmode="decimal">
<span class="dock" id="dock">$54</span>
</div></div>
<script>
(function(){
function AH(){var h=innerHeight;try{var sa=navigator.standalone===true||(matchMedia&&matchMedia('(display-mode: standalone)').matches);if(sa&&innerHeight>innerWidth)h=Math.max(h,screen.height||0,(visualViewport&&visualViewport.height)||0)}catch(e){}document.documentElement.style.setProperty('--app-h',h+'px');return h}
AH();
addEventListener('resize',AH);
addEventListener('orientationchange',AH);
addEventListener('pageshow',AH);
if(window.visualViewport)visualViewport.addEventListener('resize',AH);
[50,200,600,1500].forEach(function(t){setTimeout(AH,t)});
document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});
document.addEventListener('gesturechange',function(e){e.preventDefault()},{passive:false});
document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});
var lastTouchEnd=0;
document.addEventListener('touchend',function(e){var now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now},{passive:false});

var amt=document.getElementById('amt'),amtin=document.getElementById('amtin'),dock=document.getElementById('dock');
var bal=54.20;
try{var saved=localStorage.getItem('cashapp_balance');if(saved!==null&&!isNaN(parseFloat(saved)))bal=parseFloat(saved)}catch(e){}
function render(){amt.textContent='$'+bal.toFixed(2);dock.textContent='$'+Math.round(bal)}
render();

var holdTimer=null;
function startHold(){
  cancelHold();
  amt.classList.add('hold');
  holdTimer=setTimeout(function(){
    amt.classList.remove('hold');
    enterEdit();
  },3000);
}
function cancelHold(){
  if(holdTimer){clearTimeout(holdTimer);holdTimer=null}
  amt.classList.remove('hold');
}
function enterEdit(){
  amtin.value=bal.toFixed(2);
  amt.style.display='none';
  amtin.style.display='block';
  amtin.focus();
  amtin.select();
}
function commitEdit(){
  var v=parseFloat(amtin.value);
  if(!isNaN(v)&&v>=0)bal=Math.round(v*100)/100;
  amtin.style.display='none';
  amt.style.display='';
  render();
  try{localStorage.setItem('cashapp_balance',bal)}catch(e){}
}
amt.addEventListener('pointerdown',startHold);
amt.addEventListener('pointerup',cancelHold);
amt.addEventListener('pointerleave',cancelHold);
amt.addEventListener('pointercancel',cancelHold);
amtin.addEventListener('blur',commitEdit);
amtin.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();amtin.blur()}});
})();
</script>
</body></html>
