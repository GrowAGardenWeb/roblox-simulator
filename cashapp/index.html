<!doctype html>
<html lang="en"><head><script>window.MS_REQUIRED_PRODUCT='cashapp';</script><script src="/access-gate.js"></script>
<meta charset="utf-8">
<script>(function(){var h=innerHeight;try{var sa=navigator.standalone===true||(matchMedia&&matchMedia("(display-mode: standalone)").matches);if(sa&&innerHeight>innerWidth)h=Math.max(h,screen.height||0,(visualViewport&&visualViewport.height)||0)}catch(e){}document.documentElement.style.setProperty("--app-h",h+"px")})()</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cash App">
<meta name="theme-color" content="#000000">
<title>Money</title>
<style>
html,body{height:var(--app-h,100%);overflow:hidden;margin:0;background:#000;touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior:none}
.wrap{position:fixed;top:0;left:0;right:0;height:var(--app-h,100%);margin:0;overflow:hidden;display:flex;justify-content:center}
.scroll{width:100%;max-width:620px;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.ui{position:relative;width:100%;aspect-ratio:1320/4560;container-type:inline-size;background:top/100% 100% no-repeat url(money.png)}
.amt{position:absolute;left:5.45%;top:19.76%;transform:translateY(-50%);font-family:"Helvetica Neue",Arial,sans-serif;font-weight:800;color:#fff;font-size:14.9cqw;line-height:1;white-space:nowrap;pointer-events:none}
.digits{position:absolute;left:18.64%;top:12.24%;transform:translateY(-50%);font-family:"Helvetica Neue",Arial,sans-serif;font-weight:600;color:#1c1c1e;font-size:3.1cqw;line-height:1;white-space:nowrap;pointer-events:none}
.cashtag{position:absolute;right:5.3%;top:12.37%;transform:translateY(-50%);font-family:"Helvetica Neue",Arial,sans-serif;font-weight:400;color:#5b5b5e;font-size:4.3cqw;line-height:1;white-space:nowrap;text-align:right;pointer-events:none}
.savings{position:absolute;left:9.09%;top:42.04%;transform:translateY(-50%);font-family:"Helvetica Neue",Arial,sans-serif;font-weight:800;color:#fff;font-size:9.26cqw;line-height:1;white-space:nowrap;pointer-events:none}
.avatar{position:absolute;left:91.36%;top:6.19%;width:11.52cqw;height:11.52cqw;transform:translate(-50%,-50%);border-radius:50%;background:#2c2c2e center/cover no-repeat;pointer-events:none}
.hitadd{position:absolute;left:3.64%;top:26.54%;width:45.45%;height:3.42%;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dockoverlay{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:100%;max-width:620px;display:flex;justify-content:center;pointer-events:none}
.dockbar{position:relative;width:61.82%;aspect-ratio:816/186;container-type:inline-size;background:center/100% 100% no-repeat url(dock.png);pointer-events:auto}
.dock{position:absolute;left:15.99%;top:51.6%;transform:translate(-50%,-50%);font-family:"Helvetica Neue",Arial,sans-serif;font-weight:700;color:#fff;font-size:9.4cqw;line-height:1;white-space:nowrap;pointer-events:none}

.sheetwrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheetwrap[hidden]{display:none}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet{position:relative;width:100%;max-width:620px;background:#111113;border-radius:24px 24px 0 0;padding:18px 20px calc(env(safe-area-inset-bottom,0px) + 24px);box-sizing:border-box;font-family:"Helvetica Neue",Arial,sans-serif;color:#fff;max-height:82vh;overflow-y:auto}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.sheethead span{font-size:19px;font-weight:700}
.closebtn{width:30px;height:30px;border-radius:50%;border:0;background:#222;color:#aaa;font-size:16px;cursor:pointer}
.sheetavatarrow{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.sheetavatar{width:56px;height:56px;border-radius:50%;background:#2c2c2e center/cover no-repeat;flex:none}
.sheetavatarbtn{border:0;background:#1d1d1f;color:#4fa3ff;font-size:15px;font-weight:600;padding:9px 14px;border-radius:999px;cursor:pointer}
.sheetrow{margin-bottom:16px}
.sheetrow label{display:block;font-size:13px;color:#8e8e93;margin-bottom:6px}
.inwrap{display:flex;align-items:center;background:#1d1d1f;border-radius:12px;padding:12px 14px;gap:4px}
.inwrap span{color:#8e8e93;font-size:17px}
.inwrap input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font-size:17px;font-family:inherit}
.savebtn{width:100%;border:0;background:#fff;color:#000;font-size:17px;font-weight:700;padding:15px;border-radius:999px;cursor:pointer;margin-top:4px}
</style>
</head>
<body>
<div class="wrap"><div class="scroll"><div class="ui" id="ui">
<span class="amt" id="amt">$54.20</span>
<span class="digits" id="digits">9427</span>
<span class="cashtag" id="cashtag">$jwr2239</span>
<span class="savings" id="savings">$0.00</span>
<div class="avatar" id="avatar"></div>
<button class="hitadd" id="hitadd" aria-label="Edit account"></button>
</div></div>
<div class="dockoverlay"><div class="dockbar"><span class="dock" id="dock">$54</span></div></div>
</div>

<div class="sheetwrap" id="sheetwrap" hidden>
<div class="dim" id="dim"></div>
<div class="sheet">
  <div class="sheethead"><span>Edit account</span><button class="closebtn" id="closebtn">&#10005;</button></div>
  <div class="sheetavatarrow">
    <div class="sheetavatar" id="sheetavatar"></div>
    <button class="sheetavatarbtn" id="sheetavatarbtn">Change photo</button>
    <input type="file" accept="image/*" id="avatarfile" style="display:none">
  </div>
  <div class="sheetrow"><label>Cash balance</label><div class="inwrap"><span>$</span><input id="pbal" inputmode="decimal"></div></div>
  <div class="sheetrow"><label>Savings balance</label><div class="inwrap"><span>$</span><input id="psav" inputmode="decimal"></div></div>
  <div class="sheetrow"><label>Card last 4 digits</label><div class="inwrap"><span>&#8226;&#8226;</span><input id="pdigits" inputmode="numeric" maxlength="4"></div></div>
  <div class="sheetrow"><label>Cashtag</label><div class="inwrap"><span>$</span><input id="ptag"></div></div>
  <button class="savebtn" id="savebtn">Done</button>
</div>
</div>

<script>
(function(){
function AH(){var h=innerHeight;try{var sa=navigator.standalone===true||(matchMedia&&matchMedia('(display-mode: standalone)').matches);if(sa&&innerHeight>innerWidth)h=Math.max(h,screen.height||0,(visualViewport&&visualViewport.height)||0)}catch(e){}document.documentElement.style.setProperty('--app-h',h+'px');return h}
AH();
addEventListener('resize',AH);
addEventListener('orientationchange',AH);
addEventListener('pageshow',AH);
if(window.visualViewport)visualViewport.addEventListener('resize',AH);
[50,200,600,1500].forEach(function(t){setTimeout(AH,t)});
document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});
document.addEventListener('gesturechange',function(e){e.preventDefault()},{passive:false});
document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});
var lastTouchEnd=0;
document.addEventListener('touchend',function(e){var now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now},{passive:false});

var amt=document.getElementById('amt'),dock=document.getElementById('dock');
var digits=document.getElementById('digits');
var cashtag=document.getElementById('cashtag');
var savings=document.getElementById('savings');
var avatar=document.getElementById('avatar'),sheetavatar=document.getElementById('sheetavatar'),avatarfile=document.getElementById('avatarfile');

var bal=54.20,sav=0,cardDigits='9427',tag='jwr2239',avatarUrl=null;
try{var s1=localStorage.getItem('cashapp_balance');if(s1!==null&&!isNaN(parseFloat(s1)))bal=parseFloat(s1)}catch(e){}
try{var s0=localStorage.getItem('cashapp_savings');if(s0!==null&&!isNaN(parseFloat(s0)))sav=parseFloat(s0)}catch(e){}
try{var s2=localStorage.getItem('cashapp_card_digits');if(s2&&/^\d{4}$/.test(s2))cardDigits=s2}catch(e){}
try{var s3=localStorage.getItem('cashapp_cashtag');if(s3)tag=s3}catch(e){}
try{var s4=localStorage.getItem('cashapp_avatar');if(s4)avatarUrl=s4}catch(e){}

var ui=document.getElementById('ui'),dockbar=document.querySelector('.dockbar');
function fitText(el,containerEl,baseFrac,maxWidthFrac){
  var cw=containerEl.getBoundingClientRect().width;
  if(!cw)return;
  var fontPx=cw*baseFrac;
  el.style.fontSize=fontPx+'px';
  var tw=el.getBoundingClientRect().width;
  var maxW=cw*maxWidthFrac;
  if(tw>maxW){
    el.style.fontSize=(fontPx*(maxW/tw))+'px';
  }
}
function renderAll(){
  amt.textContent='$'+bal.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  dock.textContent='$'+Math.round(bal).toLocaleString('en-US');
  savings.textContent='$'+sav.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  digits.textContent=cardDigits;
  cashtag.textContent='$'+tag;
  if(avatarUrl){avatar.style.backgroundImage='url('+avatarUrl+')';sheetavatar.style.backgroundImage='url('+avatarUrl+')'}
  fitText(amt,ui,.149,.90);
  fitText(dock,dockbar,.094,.28);
  fitText(savings,ui,.0926,.82);
}
renderAll();
addEventListener('resize',renderAll);
addEventListener('orientationchange',renderAll);

var hitadd=document.getElementById('hitadd'),sheetwrap=document.getElementById('sheetwrap'),dim=document.getElementById('dim'),closebtn=document.getElementById('closebtn'),savebtn=document.getElementById('savebtn');
var pbal=document.getElementById('pbal'),psav=document.getElementById('psav'),pdigits=document.getElementById('pdigits'),ptag=document.getElementById('ptag');

function openSheet(){
  pbal.value=bal.toFixed(2);
  psav.value=sav.toFixed(2);
  pdigits.value=cardDigits;
  ptag.value=tag;
  sheetwrap.hidden=false;
}
function closeSheet(){sheetwrap.hidden=true}

function save(){
  var n=parseFloat(pbal.value);
  if(!isNaN(n)&&n>=0)bal=Math.round(n*100)/100;
  var ns=parseFloat(psav.value);
  if(!isNaN(ns)&&ns>=0)sav=Math.round(ns*100)/100;
  var d=pdigits.value.replace(/\D/g,'').slice(0,4);
  if(d.length===4)cardDigits=d;
  var t=ptag.value.replace(/^\$+/,'').replace(/[^a-zA-Z0-9]/g,'').slice(0,20);
  if(t)tag=t;
  renderAll();
  try{
    localStorage.setItem('cashapp_balance',bal);
    localStorage.setItem('cashapp_savings',sav);
    localStorage.setItem('cashapp_card_digits',cardDigits);
    localStorage.setItem('cashapp_cashtag',tag);
  }catch(e){}
  closeSheet();
}

hitadd.addEventListener('click',openSheet);
dim.addEventListener('click',closeSheet);
closebtn.addEventListener('click',closeSheet);
savebtn.addEventListener('click',save);

document.getElementById('sheetavatarbtn').addEventListener('click',function(){avatarfile.click()});
avatarfile.addEventListener('change',function(){
  var f=avatarfile.files&&avatarfile.files[0];
  if(!f)return;
  var reader=new FileReader();
  reader.onload=function(){
    avatarUrl=reader.result;
    sheetavatar.style.backgroundImage='url('+avatarUrl+')';
    avatar.style.backgroundImage='url('+avatarUrl+')';
    try{localStorage.setItem('cashapp_avatar',avatarUrl)}catch(e){}
  };
  reader.readAsDataURL(f);
});
})();
</script>
</body></html>
