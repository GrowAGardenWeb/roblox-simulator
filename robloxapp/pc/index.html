<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roblox</title>
<link rel="stylesheet" href="style.css">
<script src="icons.js"></script>
<script src="/robloxapp/draco_decoder.js"></script>
</head>
<body>
<div class="win" id="win">
  <header class="tb" id="tb">
    <img class="tb-ic" src="img/app.webp" alt="">
    <span class="tb-t">Roblox</span>
    <div class="tb-btns">
      <button id="wmin" aria-label="Minimize"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="#111" stroke-width="1"/></svg></button>
      <button id="wmax" aria-label="Maximize"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="2.5" width="6.5" height="6.5" rx="1" fill="none" stroke="#111"/><path d="M3 2.5V1.8C3 1.4 3.3 1 3.8 1H8.2C8.6 1 9 1.4 9 1.8V6.2C9 6.6 8.6 7 8.2 7H7.5" fill="none" stroke="#111"/></svg></button>
      <button id="wcls" class="x" aria-label="Close"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9" stroke="#111" stroke-width="1"/></svg></button>
    </div>
  </header>

  <div class="app">
    <nav class="side">
      <button class="menu" aria-label="Menu"><i data-ic="menu-r" data-s="25"></i><i class="dot"></i></button>
      <button class="sb on" data-s="home" id="sbHome"><i data-ic="house-f" data-s="26"></i><span>Home</span></button>
      <button class="sb" data-s="moments"><i data-ic="moments-r" data-s="25"></i><span>Moments</span></button>
      <button class="sb" data-s="chat"><i data-ic="chat-r" data-s="25"></i><span>Chat</span></button>
      <button class="sb" data-s="me"><img class="si av" id="sideAv" src="img/av_side.webp" alt="" style="width:28px;height:28px"><span>Me</span></button>
      <button class="logo-b" aria-label="Roblox"><i data-ic="rbx-f" data-s="30"></i></button>
    </nav>

    <main class="main">
      <div class="top">
        <img class="logo" id="logo" src="img/logo.svg" alt="Roblox" style="width:104px;height:21.3px">
        <label class="search"><i data-ic="search-r" data-s="25"></i><input id="q" type="text" placeholder="Search" autocomplete="off"></label>
        <div class="me">
          <img class="me-av" id="meAv" src="img/av_me.webp" alt="">
          <b id="meName">munfuja</b>
          <i class="ver" id="ver" hidden data-ic="ver-f" data-s="20"></i>
          <i class="prem" id="prem" data-ic="rplus-r" data-s="17"></i>
          <button class="rbx" id="openRb" aria-label="Robux"><i data-ic="robux-r" data-s="25"></i></button>
          <button class="bell" aria-label="Notifications"><i data-ic="bell-r" data-s="27"></i><i class="bdg" id="bellN">3</i></button>
        </div>
      </div>

      <section class="scr" id="s-home">
        <div class="tabs"><button class="on">For you</button><button>Charts</button></div>
        <div class="friends" id="friends"></div>
        <h3 class="rh first">Recommended For You</h3>
        <div class="games" id="games"></div>
      </section>

      <section class="scr" id="s-charts" hidden>
        <div class="tabs"><button>For you</button><button class="on">Charts</button></div>
        <div class="chips"><button class="chip" id="chDev" data-k="dev"><span>Computer</span><i data-ic="chevd-r" data-s="22"></i></button><button class="chip" id="chCty" data-k="cty"><span>Mexico</span><i data-ic="chevd-r" data-s="22"></i></button></div>
        <div id="chartRows"></div>
      </section>
    </main>

    <section class="sch" id="s-sch" hidden>
      <div class="sch-top"><button id="schBack" aria-label="Back"><i data-ic="chevl-r" data-s="30"></i></button><label class="schq"><i data-ic="search-r" data-s="25"></i><input id="schQ" type="text" placeholder="Search" autocomplete="off"><button id="schClr" aria-label="Clear" hidden><i data-ic="x-r" data-s="20"></i></button></label><button class="schcancel" id="schCancel">Cancel</button><div class="sch-r"><i data-ic="robux-r" data-s="25"></i><i data-ic="bell-r" data-s="27"></i></div></div>
      <div class="sch-tabs" id="schTabs" hidden><button class="on" data-t="top">Top</button><button data-t="games">Games</button><button data-t="people">People</button></div>
      <div class="sch-body" id="schBody"></div>
      <div class="scrim2" id="pfScrim" hidden></div>
      <aside class="pf" id="pf" hidden></aside>
    </section>

    <section class="av" id="s-av" hidden>
      <div class="av-l">
        <div class="av-top">
          <div class="seg"><button class="on" id="avM">Marketplace</button><button id="avC">Customize</button></div>
          <button class="av-s" aria-label="Search"><i data-ic="search-r" data-s="30"></i></button>
        </div>
        <div class="av-sc" id="avSc">
          <div class="cats" id="cats"><button class="on" data-k="all">All</button><button data-k="avatars">Avatars</button><button data-k="backgrounds">Backgrounds</button><button data-k="body">Body</button><button data-k="clothing">Clothing</button><button data-k="accessories">Accessories</button><button data-k="animations">Animations</button><button data-k="makeup">Makeup</button><span class="flt"><i data-ic="sliders-r" data-s="28"></i></span></div>
          <div id="avRows"></div>
        </div>
        <div class="av-sc" id="cuSc" hidden>
          <div class="cats" id="cuCats"><button class="on" data-k="all">All</button><button data-k="avatars">Avatars</button><button data-k="body">Body</button><button data-k="clothing">Clothing</button><button data-k="accessories">Accessories</button><button data-k="backgrounds">Backgrounds</button><button data-k="animations">Animations</button><button data-k="emotes">Emotes</button><button data-k="makeup">Makeup</button><span class="flt"><i data-ic="sliders-r" data-s="28"></i></span></div>
          <div class="bsub" id="bsub" hidden><div class="bsr" id="bsr"></div><div class="bpl"><span>Body Parts</span><button class="chip2"><span>Full Body</span><i data-ic="chevd-r" data-s="22"></i></button></div></div>
          <div class="avg cg" id="cuGrid"></div>
        </div>
      </div>
      <div class="av-r" id="avR">
        <img class="av-fb" id="avFb" alt="" hidden>
        <div class="av-bg" id="avBg"><img src="img/scene.webp" alt=""><img class="av-fig" id="avFig" alt="" hidden style="display:none"><div class="av-3d" id="av3d"></div></div>
        <div class="av-tools"><span class="tb1"><img id="avHead" src="img/av_me.webp" alt=""></span><span class="tb1"><i data-ic="pgear-r" data-s="26"></i></span><span class="tb2"><i data-ic="undo-r" data-s="24"></i><i data-ic="redo-r" data-s="24"></i></span></div>
        <div class="av-rb"><i data-ic="robux-r" data-s="22"></i><span id="avRb">1K</span></div>
      </div>
    </section>
  </div>

<section class="rb" id="rb" hidden>
  <div class="rb-bar"><button class="rb-x" id="rbX" aria-label="Close"><i data-ic="x-r" data-s="30"></i></button><div class="rb-t"><small id="rbU">munfuja: 13+</small><span>Balance: <span id="rbBal">1,000</span> Robux</span></div></div>
  <div class="rb-sc">
    <div class="rb-col">
      <div class="rb-pill"><i data-ic="robux-r" data-s="34"></i><b id="rbPill">1,000</b><button id="rbSend"><i data-ic="up-r" data-s="16"></i>Send</button></div>
      <img class="rbx-top" src="img/rbx_top.webp" alt="">
      <div id="rbHot"></div>
      <div id="rbFaq"></div>
    </div>
  </div>
</section>

<div class="sr" id="buy" hidden><div class="sr-box buy-box" id="buyBox"></div></div>
<div class="pop-scrim" id="popScrim" hidden></div>
<div class="pop" id="pop" hidden>
  <div class="pop-top"><label class="schq pq"><i data-ic="search-r" data-s="25"></i><input id="popQ" type="text" placeholder="Search" autocomplete="off"></label><button id="popCancel">Cancel</button></div>
  <div class="pop-body" id="popBody"></div>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drw" id="drw" aria-hidden="true"></aside>

<div class="sr" id="sr" hidden>
  <div class="sr-box" id="srBox"></div>
</div>

<div class="sr ap" id="ap" hidden>
  <div class="sr-box ap-box" id="apBox"></div>
</div>
</div>
<script src="avatar3d.js"></script>
<script src="app.js"></script>
</body>
</html>
