<!DOCTYPE html>
<html lang="en" style="--app-h: 100%; background: #fff">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Roblox" />
    <title>Roblox</title>
    <link rel="icon" type="image/png" href="/robloxapp/favicon.png" />
    <link rel="apple-touch-icon" href="/robloxapp/favicon.png" />
    <link rel="manifest" href="/robloxapp/manifest.json" />
    <script>window.MS_REQUIRED_PRODUCT = 'mobile';</script>
    <script src="/access-gate.js"></script>
    <script src="/robloxapp/draco_decoder.js"></script>
    <script>
      // Themes: light, dark, or custom. Dark mode is invert(.93)+hue-rotate(180deg)
      // on #root. A custom theme is one SVG colour matrix on #root (#thF) that maps
      // the app's whites/greys/blacks onto shades of the chosen colour; images,
      // canvas and brand buttons get the exact inverse (#thI) so they keep their
      // real colours. Applied here, before first paint, so nothing flashes.
      ;(function () {
        var HUE180 = [[-0.574, 1.43, 0.144], [0.426, 0.43, 0.144], [0.426, 1.43, -0.856]]
        var root = document.documentElement
        function rgb(hex) {
          hex = String(hex || '').replace('#', '')
          return [0, 2, 4].map(function (i) { return parseInt(hex.substr(i, 2), 16) / 255 || 0 })
        }
        function toHsl(c) {
          var mx = Math.max.apply(0, c), mn = Math.min.apply(0, c), l = (mx + mn) / 2, d = mx - mn, h = 0, s = 0
          if (d) {
            s = d / (1 - Math.abs(2 * l - 1))
            h = mx === c[0] ? ((c[1] - c[2]) / d) % 6 : mx === c[1] ? (c[2] - c[0]) / d + 2 : (c[0] - c[1]) / d + 4
          }
          return [h * 60, s, l]
        }
        function fromHsl(h, s, l) {
          var k = function (n) { return (n + h / 30) % 12 }, a = s * Math.min(l, 1 - l)
          return [0, 8, 4].map(function (n) { return l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)) })
        }
        function inv3(m) {
          var a = m[0][0], b = m[0][1], c = m[0][2], d = m[1][0], e = m[1][1], f = m[1][2], g = m[2][0], h = m[2][1], i = m[2][2]
          var A = e * i - f * h, B = f * g - d * i, C = d * h - e * g, det = a * A + b * B + c * C
          return [[A / det, (c * h - b * i) / det, (b * f - c * e) / det],
                  [B / det, (a * i - c * g) / det, (c * d - a * f) / det],
                  [C / det, (b * g - a * h) / det, (a * e - b * d) / det]]
        }
        function apply3(t, c) {
          return [0, 1, 2].map(function (r) { return t[0][r][0] * c[0] + t[0][r][1] * c[1] + t[0][r][2] * c[2] + t[1][r] })
        }
        function clamp01(c) { return c.map(function (v) { return Math.max(0, Math.min(1, v)) }) }
        // Affine colour map {m: 3x3, b: offset} for the chosen page colour (and
        // optional bottom-bar colour, which is always darker than the page).
        function build(color, navColor) {
          var hsl = toHsl(rgb(color)), dark = hsl[2] < 0.5, m, b, bg, nav
          if (dark) {
            bg = hsl[2] <= 0.25 ? rgb(color) : fromHsl(hsl[0], hsl[1], 0.22)
            var bgL = toHsl(bg)
            nav = navColor ? rgb(navColor) : fromHsl(bgL[0], bgL[1], bgL[2] * 0.72)
            // the darkest the filter can output is what page white maps to, so map
            // white -> bar colour and lift the page background to the chosen colour
            var ink = fromHsl(hsl[0], Math.min(hsl[1], 0.35), 0.95)
            m = []; b = []
            for (var r = 0; r < 3; r++) {
              var q = (ink[r] - nav[r]) / 0.86, p = nav[r] - 0.07 * q
              m.push(HUE180[r].map(function (v) { return -0.86 * q * v }))
              b.push(p + 0.93 * q)
            }
          } else {
            bg = hsl[2] >= 0.8 ? rgb(color) : fromHsl(hsl[0], hsl[1], 0.9)
            var bgH = toHsl(bg)
            nav = navColor ? rgb(navColor) : fromHsl(bgH[0], Math.min(1, bgH[1] + 0.05), Math.max(0, bgH[2] - 0.11))
            var dk = fromHsl(hsl[0], Math.min(hsl[1], 0.5), 0.1)
            m = [0, 1, 2].map(function (r) { return [0, 1, 2].map(function (c) { return r === c ? bg[r] - dk[r] : 0 }) })
            b = dk
          }
          var mi = inv3(m), bi = mi.map(function (row) { return -(row[0] * b[0] + row[1] * b[1] + row[2] * b[2]) })
          var inv = [mi, bi]
          // pre-filter colours for the page background and the bottom bar
          return { dark: dark, bg: bg, fwd: [m, b], inv: inv,
                   pagePre: clamp01(apply3(inv, bg)), navPre: clamp01(apply3(inv, nav)) }
        }
        function values(t) {
          var out = []
          for (var r = 0; r < 3; r++) out.push(t[0][r][0], t[0][r][1], t[0][r][2], 0, t[1][r])
          return out.concat([0, 0, 0, 1, 0]).map(function (v) { return +v.toFixed(5) }).join(' ')
        }
        var state = { mode: 'light', color: '#ede6ff', nav: '#d6c3fe' }
        try {
          var saved = localStorage.getItem('theme.v1')
          if (saved === 'dark' || saved === 'custom') state.mode = saved
          state.color = localStorage.getItem('theme.color.v1') || state.color
          state.nav = localStorage.getItem('theme.nav.v1') || ''
        } catch (e) {}
        function apply() {
          var custom = state.mode === 'custom', t = custom && build(state.color, state.nav)
          root.classList.toggle('custom', !!custom)
          root.classList.toggle('dark', state.mode === 'dark' || (custom && t.dark))
          if (!custom) return ['--th-bg', '--th-page-pre', '--th-nav-pre'].forEach(function (v) { root.style.removeProperty(v) })
          var css = function (c) { return 'rgb(' + c.map(function (v) { return Math.round(v * 255) }).join(',') + ')' }
          root.style.setProperty('--th-bg', css(t.bg))
          root.style.setProperty('--th-page-pre', css(t.pagePre))
          root.style.setProperty('--th-nav-pre', css(t.navPre))
          var f = document.querySelector('#thF feColorMatrix'), i = document.querySelector('#thI feColorMatrix')
          if (f) f.setAttribute('values', values(t.fwd))
          if (i) i.setAttribute('values', values(t.inv))
        }
        window.__theme = {
          get: function () { return { mode: state.mode, color: state.color, nav: state.nav } },
          set: function (mode, color, nav) {
            state.mode = mode
            if (color) { state.color = color; state.nav = nav || '' }
            try {
              localStorage.setItem('theme.v1', mode)
              localStorage.setItem('theme.color.v1', state.color)
              localStorage.setItem('theme.nav.v1', state.nav)
            } catch (e) {}
            apply()
          },
          apply: apply
        }
        apply()
      })()
    </script>
    <script>
      // The engine does `await DracoDecoderModule()` once per mesh. Older
      // Emscripten Draco builds return a self-resolving thenable (then(cb)
      // calls cb(Module) and Module still has .then), so that await loops
      // forever and freezes the main thread. Hand out a real Promise of a
      // single shared instance with any .then stripped; this also avoids
      // instantiating the wasm again for every mesh.
      ;(function () {
        var create = window.DracoDecoderModule
        if (!create) return
        var ready = null
        window.DracoDecoderModule = function (opts) {
          if (!ready) {
            ready = new Promise(function (resolve) {
              create(opts).then(function (mod) {
                if (mod && typeof mod.then === 'function') delete mod.then
                resolve(mod)
              })
            })
          }
          return ready
        }
      })()
    </script>
    <meta name="description" content="Explore a mobile-friendly Roblox home interface that offers seamless navigation and quick access to games and social features for players on the go.">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:title" content="Roblox">
    <meta property="og:description" content="Explore a mobile-friendly Roblox home interface that offers seamless navigation and quick access to games and social features for players on the go.">
    <script type="module" crossorigin src="/robloxapp/assets/index-ve25c0735.js"></script>
    <link rel="stylesheet" crossorigin href="/robloxapp/assets/index-ve25c0735.css">
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="thF" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" /></filter>
      <filter id="thI" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" /></filter>
    </svg>
    <script>window.__theme && window.__theme.apply()</script>
    <div id="root"></div>
  </body>
</html>
