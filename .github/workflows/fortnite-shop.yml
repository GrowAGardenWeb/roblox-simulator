name: Update Fortnite shop
on:
  schedule:
    - cron: '7 0 * * *'
    - cron: '7 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fortnite-shop
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch shop
        run: node fortnite-app/tools/update-shop.mjs
      - name: Probe Epic endpoints (best effort)
        continue-on-error: true
        run: node fortnite-app/tools/probe-epic.mjs
      - name: Fetch site videos (best effort)
        continue-on-error: true
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE" && NODE_PATH=/tmp/pw/node_modules node --input-type=module -e "import('/tmp/pw/node_modules/playwright/index.mjs').then(m=>{globalThis.__pw=m})" || true
          cp fortnite-app/tools/site-media.mjs /tmp/pw/site-media.mjs
          sed -i "s#new URL('../data/site.json', import.meta.url).pathname#'$GITHUB_WORKSPACE/fortnite-app/data/site.json'#" /tmp/pw/site-media.mjs
          cd /tmp/pw && node site-media.mjs
      - name: Commit if changed
        run: |
          git config user.name "shop-bot"
          git config user.email "shop-bot@users.noreply.github.com"
          git add fortnite-app/data
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Update Fortnite shop snapshot [skip ci]" && git push; fi
