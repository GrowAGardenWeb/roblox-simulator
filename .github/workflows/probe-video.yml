name: Probe video formats
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node fortnite-app/tools/probe-video.mjs
      - name: Commit
        run: |
          git config user.name "shop-bot"; git config user.email "shop-bot@users.noreply.github.com"
          git add fortnite-app/data/probe-video.json
          git diff --cached --quiet || (git commit -m "Video format probe result [skip ci]" && git pull -q --rebase origin main && git push)
