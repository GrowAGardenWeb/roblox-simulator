const fee=mk('div','swfoot',[0,1676,921,1740]);fee.style.opacity=0;fee.innerHTML='<span>Network Fee:</span><b>$'+FEE.toFixed(2)+'</b><i>$</i>';
const swBtn=document.createElement('button');swBtn.type='button';swBtn.className='swbtn';swBtn.innerHTML='<span>Swap</span>';SW.appendChild(swBtn);
const swal=(s)=>D.c[s];
function swCalc(){const f=swal(S.from),t=swal(S.to);
  const maxC=Math.max(0,f.amt-(f.price>0?FEE/f.price:0));let a=0;
  if(S.mode==='max')a=maxC;else if(S.mode==='min')a=f.price>0?Math.min(maxC,1/f.price):0;else if(S.mode==='custom')a=f.price>0?Math.min(maxC,S.usd/f.price):0;
  const usdF=a*f.price,usdT=usdF*SPREAD,recv=t.price>0?usdT/t.price:0;return{a,usdF,usdT,recv,maxC}}
const setBig=(el,usd)=>{const sp=el.querySelectorAll('span');sp[0].textContent='$';sp[1].textContent=money(usd);fit(el,50)};
function swRender(){
  const c=swCalc(),f=COINS.find(x=>x[0]===S.from),t=COINS.find(x=>x[0]===S.to),active=c.a>0;
  haveT.textContent='I have '+amt8(swal(S.from).amt)+' '+f[1];
  rightT.textContent=(c.a?amt8(c.a):'0')+' '+S.from;rightB.textContent=(c.recv?amt(c.recv):'0')+' '+S.to;
  if(document.activeElement!==swIn)setBig(bigT,c.usdF);setBig(bigB,c.usdT);
  [['from',f],['to',t]].forEach(([k,m])=>{pills[k].querySelector('img').src=imgSrc('ic_'+m[0]);pills[k].querySelector('span').textContent=m[0]});
  const sel=S.mode==='min'?0:S.mode?1:null;thumb.style.opacity=sel===null?0:1;if(sel!==null)thumb.style.left=(sel?465:285)/9.21+'%';
  segMin.classList.toggle('on',sel===0);segMax.classList.toggle('on',sel===1);
  back.classList.toggle('on',active);swBtn.classList.toggle('on',active);foot.style.opacity=active?0:1;fee.style.opacity=active?1:0;
  if(SW.classList.contains('on'))nav.classList.toggle('away',active)}
const swLive=()=>S.mode==='custom';
swIn.addEventListener('focus',()=>{swIn.style.opacity=1;bigT.querySelectorAll('span').forEach(s=>s.style.opacity=0);swIn.value=S.usd?String(S.usd):''});
swIn.addEventListener('input',()=>{S.mode='custom';S.usd=num(swIn.value);const c=swCalc();rightT.textContent=(c.a?amt8(c.a):'0')+' '+S.from;rightB.textContent=(c.recv?amt(c.recv):'0')+' '+S.to;setBig(bigB,c.usdT);
  const active=c.a>0;back.classList.toggle('on',active);swBtn.classList.toggle('on',active);foot.style.opacity=active?0:1;fee.style.opacity=active?1:0;nav.classList.toggle('away',active);
  const sel=null;thumb.style.opacity=0;segMin.classList.remove('on');segMax.classList.remove('on')});
const swDone=()=>{swIn.style.opacity=0;bigT.querySelectorAll('span').forEach(s=>s.style.opacity=1);const c=swCalc();if(!c.a)S.mode=null;swRender()};
swIn.addEventListener('blur',swDone);swIn.addEventListener('keydown',e=>{if(e.key==='Enter')swIn.blur()});
tapBig.addEventListener('click',()=>swIn.focus());
segMin.onclick=()=>{S.mode=S.mode==='min'?null:'min';swRender()};segMax.onclick=()=>{S.mode=S.mode==='max'?null:'max';swRender()};
back.onclick=()=>{S.mode=null;S.usd=0;swRender()};
flip.onclick=()=>{[S.from,S.to]=[S.to,S.from];flip.classList.toggle('t');swRender()};
swBtn.onclick=()=>{const c=swCalc();if(!(c.a>0))return;const f=D.c[S.from],t=D.c[S.to],now=Date.now();
  f.amt=Math.max(0,f.amt-c.a);t.amt+=c.recv;
  D.tx.push({id:now+Math.random(),sym:S.from,type:'swapout',other:S.to,amt:c.a,usd:c.usdF,ts:now},{id:now+Math.random(),sym:S.to,type:'swapin',other:S.from,amt:c.recv,usd:c.usdT,ts:now});
  try{localStorage.setItem('walletui2',JSON.stringify(D))}catch(e){}
  S.mode=null;S.usd=0;render();swRender();go('wallet')};
/* asset picker */
let asSide='from';
function openAssets(side){asSide=side;const pick=side==='recv'||side==='send';
  assp.classList.toggle('pick',pick);$e('asIn').value='';$e('asSearch').classList.toggle('on',false);$e('asSearch').classList.toggle('big',pick);$e('asBody').classList.remove('s');
  assp.querySelector('.ahead').firstChild.textContent='Select Asset';
  drawAssets('');assp.querySelector('.abody').scrollTop=0;openSheet(assp)}
function drawAssets(q){
  const body=$e('asBody');body.textContent='';q=q.trim().toLowerCase();
  const match=m=>!q||m[1].toLowerCase().includes(q)||m[0].toLowerCase().includes(q);
  const row=(m,own)=>{const r=$('<button class="arow" type="button"><img alt=""><span class="n"></span><span class="y"></span></button>');
    r.querySelector('img').src=imgSrc('ic_'+m[0]);r.querySelector('.n').textContent=m[1];
    const y=r.querySelector('.y');if(own){y.textContent=amt(D.c[m[0]].amt)+' '+m[0];const sm=document.createElement('small');sm.textContent='$'+money(val(m[0]));y.appendChild(sm)}else y.textContent=m[0];
    if(m[0]===(asSide==='from'?S.from:S.to))r.classList.add('sel');
    r.onclick=()=>{if(asSide==='recv'||asSide==='send'){const f=asSide==='recv'?openRecv:openSend,s=m[0];closeSheet();setTimeout(()=>f(s),140);return}
      const other=asSide==='from'?'to':'from';if(m[0]===S[other])S[other]=S[asSide];S[asSide]=m[0];closeSheet();swRender()};return r};
  const flat=asSide==='recv'||asSide==='send';
  if(flat){const list=COINS.filter(m=>match(m)&&(asSide==='recv'||D.c[m[0]].amt>0)).sort((a,b)=>val(b[0])-val(a[0])||COINS.indexOf(a)-COINS.indexOf(b));
    list.forEach(m=>body.appendChild(row(m,D.c[m[0]].amt>0)));
    if(!list.length){const n=$('<div class="anone"></div>');n.textContent=asSide==='send'&&!q?'You have no assets to send yet.':'No results';body.appendChild(n)}return}
  if(!q){const c=$('<div class="acash"><div class="ci">$</div><div class="n">Cash</div><button type="button">+ Add money</button></div>');
    c.querySelector('button').onclick=()=>{closeSheet();setTimeout(()=>openSheet(addp),120)};body.appendChild(c)}
  const owned=COINS.filter(m=>D.c[m[0]].amt>0&&match(m)).sort((a,b)=>val(b[0])-val(a[0]));
  const rest=COINS.filter(m=>!(D.c[m[0]].amt>0)&&match(m));
  if(owned.length){const s=$('<div class="asec"></div>');s.textContent='Frequently Used';body.appendChild(s);owned.forEach(m=>body.appendChild(row(m,true)))}
  if(rest.length){const s=$('<div class="asec"></div>');s.textContent='Available for Swap';body.appendChild(s);rest.forEach(m=>body.appendChild(row(m,false)))}
  if(!owned.length&&!rest.length){const s=$('<div class="asec"></div>');s.textContent='No results';body.appendChild(s)}}
$e('asBtn').onclick=()=>{const on=$e('asSearch').classList.toggle('on');$e('asBody').classList.toggle('s',on);if(on)$e('asIn').focus({preventScroll:true})};
$e('asIn').addEventListener('input',()=>drawAssets($e('asIn').value));
assp.addEventListener('focusin',()=>requestAnimationFrame(()=>{P.scrollTop=0}));
swRender();

/* ---------- receive & send ---------- */
const CHARS32='qpzry9x8gf2tvdw0s3jn54khce6mua7l',B58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
function addrFor(sym){const c=D.c[sym];if(c&&c.addr)return c.addr;let h=7;for(const ch of sym)h=(h*131+ch.charCodeAt(0))|0;const r=rng(h^0x5bd1e995);
  const pick=(set,n)=>{let o='';for(let i=0;i<n;i++)o+=set[Math.floor(r()*set.length)];return o};
  if(sym==='BTC')return 'bc1q'+pick(CHARS32,38);if(sym==='LTC')return 'ltc1q'+pick(CHARS32,38);
  if(['ETH','USDT','USDC','BNB'].includes(sym))return '0x'+pick('0123456789abcdef',40);
  if(sym==='XRP')return 'r'+pick(B58,33);if(sym==='SOL')return pick(B58,44);if(sym==='TRX')return 'T'+pick(B58,33);
  if(sym==='DOGE')return 'D'+pick(B58,33);return 'addr1'+pick(CHARS32,54)}
function qrSvg(text){const N=33,r=rng([...text].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,11));let o='';const q=(x,y)=>(x<8&&y<8)||(x>=N-8&&y<8)||(x<8&&y>=N-8)||(Math.abs(x-16)<=4&&Math.abs(y-16)<=4);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(q(x,y))continue;if(r()<.5)o+=`<circle cx="${x+.5}" cy="${y+.5}" r=".42"/>`}
  const fin=(x,y)=>`<rect x="${x+.3}" y="${y+.3}" width="6.4" height="6.4" rx="2" fill="#12121f"/><rect x="${x+1.45}" y="${y+1.45}" width="4.1" height="4.1" rx="1.2" fill="#fff"/><rect x="${x+2.1}" y="${y+2.1}" width="2.8" height="2.8" rx="1.1" fill="#12121f"/>`;
  return `<g fill="#12121f" transform="translate(2 2)">${o}${fin(0,0)}${fin(N-7,0)}${fin(0,N-7)}</g>`}
const fcopy=async(text,btn,done)=>{try{await navigator.clipboard.writeText(text)}catch(e){try{const t=document.createElement('textarea');t.value=text;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}catch(e2){}}
  done();};
const rq=s=>recvp.querySelector(s),sq=s=>sendp.querySelector(s);
let rsSym='BTC';
function openRecv(sym){rsSym=sym;const m=COINS.find(c=>c[0]===sym),ad=addrFor(sym);
  rq('.ftitle').textContent='Receive '+m[1];rq('.al').textContent='Your '+sym+' Address';rq('.av').textContent=ad;
  rq('.qrcard svg').innerHTML=qrSvg(ad);rq('.qrcard img').src=imgSrc('ic_'+sym);rq('.cp').innerHTML=COPYI;rq('.fshare').textContent='Share';
  openSheet(recvp)}
const COPYI=recvp.querySelector('.cp').innerHTML,CHECKI='<svg viewBox="0 0 24 24" fill="none" stroke="#6bd62a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
rq('.cp').onclick=()=>fcopy(addrFor(rsSym),rq('.cp'),()=>{rq('.cp').innerHTML=CHECKI;setTimeout(()=>rq('.cp').innerHTML=COPYI,1400)});
rq('.fshare').onclick=()=>fcopy(addrFor(rsSym),rq('.fshare'),()=>{rq('.fshare').textContent='Copied';setTimeout(()=>rq('.fshare').textContent='Share',1400)});
rq('.fback').onclick=()=>{closeSheet();setTimeout(()=>openAssets('recv'),140)};
let snd={sym:'BTC',addr:''};
const sShort=a=>a.length>20?a.slice(0,10)+'\u2026'+a.slice(-8):a;
function sReady(){const ok=$e('sAddr').value.trim().length>=10;$e('sGo').classList.toggle('ready',ok);return ok}
function sCalc(){const c=D.c[snd.sym],usd=num($e('sUsd').value),coin=c.price>0?Math.min(usd/c.price,c.amt):0;return{usd,coin,c}}
function sUpd(){const k=sCalc();sq('.eq').textContent='\u2248 '+amt8(k.coin)+' '+snd.sym+(k.c.price>0&&k.usd/k.c.price>k.c.amt?'  (max available)':'');
  $e('sSend').classList.toggle('ready',k.coin>0)}
function openSend(sym){snd.sym=sym;const m=COINS.find(c=>c[0]===sym);
  sendp.classList.remove('two');sq('.sbig').src=imgSrc('ic_'+sym);sq('.stit').textContent='Send '+m[1];$e('sAddr').placeholder='Tap to paste '+sym+' address';$e('sAddr').value='';sReady();
  sq('.t2').textContent='Send '+m[1];$e('sUsd').value='';sUpd();openSheet(sendp)}
$e('sAddr').addEventListener('input',sReady);
$e('sAddr').addEventListener('focus',async()=>{if($e('sAddr').value)return;try{const t=(await navigator.clipboard.readText()||'').trim();if(t.length>=10&&t.length<=120){$e('sAddr').value=t;sReady()}}catch(e){}});
$e('sGo').onclick=()=>{if(!sReady()){$e('sAddr').focus({preventScroll:true});return}
  snd.addr=$e('sAddr').value.trim();const c=D.c[snd.sym];
  sq('.chip').textContent=sShort(snd.addr);sq('.av2').textContent='Available: '+amt8(c.amt)+' '+snd.sym+' ($'+money(c.amt*c.price)+')';sUpd();sendp.classList.add('two')};
$e('sUsd').addEventListener('input',sUpd);
$e('sMax').onclick=()=>{const c=D.c[snd.sym];$e('sUsd').value=(c.amt*c.price).toFixed(2);sUpd()};
$e('sBack2').onclick=()=>sendp.classList.remove('two');
sendp.querySelector('.s1 .fback').onclick=()=>{closeSheet();setTimeout(()=>openAssets('send'),140)};
$e('sSend').onclick=()=>{const k=sCalc();if(!(k.coin>0))return;const now=Date.now();
  D.c[snd.sym].amt=Math.max(0,D.c[snd.sym].amt-k.coin);D.tx.push({id:now+Math.random(),sym:snd.sym,type:'send',other:'',amt:k.coin,usd:k.coin*k.c.price,ts:now});
  try{localStorage.setItem('walletui2',JSON.stringify(D))}catch(e){}render();closeSheet()};
sendp.addEventListener('focusin',()=>requestAnimationFrame(()=>{P.scrollTop=0}));
// wallet pills: Receive / Send
hs(W.content,246,997,472,1078,()=>openAssets('recv'),CH);
hs(W.content,489,997,680,1078,()=>openAssets('send'),CH);

/* ---------- hold the screen 1.5 s to open the editor ---------- */
let timer=null,sx=0,sy=0,suppress=false;
const cancel=()=>{clearTimeout(timer);timer=null};
P.addEventListener('pointerdown',e=>{
  if(edit.classList.contains('on'))return;
  suppress=false;sx=e.clientX;sy=e.clientY;cancel();
  timer=setTimeout(()=>{timer=null;suppress=true;openEdit()},1500)});
P.addEventListener('pointermove',e=>{if(timer&&Math.hypot(e.clientX-sx,e.clientY-sy)>14)cancel()});
['pointerup','pointercancel','pointerleave'].forEach(n=>P.addEventListener(n,cancel));
P.addEventListener('click',e=>{if(suppress){e.stopPropagation();e.preventDefault();suppress=false}},true);
P.addEventListener('contextmenu',e=>e.preventDefault());
go('wallet');
