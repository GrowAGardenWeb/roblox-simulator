<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wallet UI</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#1d1d36;color:#fff;overflow:hidden}
:root{color-scheme:dark}
#phone{position:fixed;inset:0;overflow:hidden;background:#1d1d36;touch-action:pan-y;
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.screen{position:absolute;inset:0;container-type:inline-size;opacity:0;pointer-events:none;transition:opacity .25s}
.screen.on{opacity:1;pointer-events:auto}
.screen>img,.content>img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroller::-webkit-scrollbar{display:none}
.content{position:relative;width:100%}
.tx[data-hidden]{display:none}
.hid .tx[data-hidden]{display:flex}.hid .tx[data-k=bal],.hid .tx[data-k=amt]{display:none}
.nav{position:absolute;left:20.4%;width:59.4%;bottom:3.45%;aspect-ratio:547/151;border-radius:999px;z-index:3;transition:transform .3s ease,opacity .3s}
.nav img{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.nav[data-t=wallet] .iw,.nav[data-t=swap] .is,.nav[data-t=cash] .ic{opacity:1}
.nav.gone{display:none}
.nav button{position:absolute;top:0;height:100%;width:33.4%;border:0;background:none;padding:0;cursor:pointer;border-radius:999px;-webkit-tap-highlight-color:transparent}
.nav button:focus-visible{outline:2px solid #fff}
.nav.away{transform:translateY(160%);opacity:0}
.tx{position:absolute;display:flex;align-items:center;white-space:pre;line-height:1.15;color:#fff;pointer-events:none}
.tx.l{justify-content:flex-start}.tx.c{justify-content:center;text-align:center}.tx.r{justify-content:flex-end;text-align:right}
.tx span{font-variant-numeric:tabular-nums}
.hs{position:absolute;cursor:pointer;border-radius:12px}
#scrim{position:absolute;inset:0;background:rgba(5,5,15,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
#scrim.on{opacity:1;pointer-events:auto}
#port,#addp{position:absolute;left:0;right:0;bottom:0;z-index:6;transform:translateY(105%);transition:transform .45s cubic-bezier(.22,.9,.28,1);container-type:inline-size;touch-action:none}
#port{aspect-ratio:1320/1798}#addp{aspect-ratio:1320/1327}
#port.on,#addp.on{transform:none}
#port.drag,#addp.drag{transition:none}
#port>.screen,#addp>.screen{opacity:1;pointer-events:auto}
.hl{position:absolute;left:0;width:100%;top:calc(630/2001*100%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.hl div{font-size:6.73cqw;line-height:8.03cqw;font-weight:700;white-space:nowrap;letter-spacing:-.01em}
.hl .a{color:#fff}.hl .b{color:#a0a3ad}
.hl.in .a,.hl.in .b{animation:hlIn .65s cubic-bezier(.2,.8,.2,1) both}
.hl.in .b{animation-delay:.12s}
.hl.out div{animation:hlOut .35s ease-in both}
@keyframes hlIn{from{opacity:0;transform:translateY(.55em);filter:blur(7px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes hlOut{to{opacity:0;transform:translateY(-.4em);filter:blur(5px)}}
@media (prefers-reduced-motion:reduce){.hl div{animation-duration:.01s!important;animation-delay:0s!important}#port,#addp{transition-duration:.01s}}
#edit{position:absolute;inset:0;z-index:20;display:none;align-items:flex-end;background:rgba(5,5,15,.6);touch-action:auto;-webkit-user-select:text;user-select:text}
#edit.on{display:flex}
#edit .sheet{width:100%;box-sizing:border-box;background:#2d2e40;border-radius:28px 28px 0 0;padding:14px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
#edit .grab{width:46px;height:5px;border-radius:3px;background:#5a5b72;margin:0 auto 14px}
#edit h2{margin:0 0 4px;font-size:19px;font-weight:600;text-align:center;color:#c2c2d0}
#edit .tot{text-align:center;color:#8c8ca2;font-size:14px;margin-bottom:14px}
#edit .tot b{color:#fff;font-size:22px;font-weight:600}
#edit .g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#edit label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#9b9bb1;letter-spacing:.03em;text-transform:uppercase;min-width:0}
#edit label.w{grid-column:1/-1}
#edit input{font:inherit;font-size:17px;text-transform:none;letter-spacing:0;color:#fff;background:#1d1d30;border:1px solid #45465e;border-radius:12px;padding:11px 12px;width:100%;box-sizing:border-box;min-width:0}
#edit input:focus{outline:2px solid #7c5cf0;border-color:transparent}
#edit .b{display:flex;gap:10px;margin-top:16px}
#edit button{flex:1;font:inherit;font-size:16px;font-weight:600;border:0;border-radius:14px;padding:13px;color:#fff;background:#3d3e55;cursor:pointer}
#edit button.p{background:#5b3fd6}
#edit button:focus-visible{outline:2px solid #fff}
#edit h3{margin:18px 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8c8ca2}
#edit .cb{background:#252638;border:1px solid #3a3b52;border-radius:14px;padding:10px 12px 12px;margin-bottom:10px}
#edit .ch{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#edit .ch .t{flex:1;min-width:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#edit .ch .t i{font-style:normal;color:#8c8ca2;font-weight:500;margin-left:6px}
#edit .ch button{flex:none;width:34px;height:34px;padding:0;border-radius:10px;font-size:20px;line-height:1;background:#3a2b3a;color:#ff8d8d}
#edit .empty{color:#7c7c92;font-size:14px;margin:0 0 6px}
#edit button.a{margin-top:12px;width:100%;flex:none;background:#2f6f4a}
.extra{position:relative;padding:0 3.6cqw 32cqw;box-sizing:border-box;display:flex;flex-direction:column}
.crows{display:flex;flex-direction:column;gap:1.2cqw;margin-top:1.2cqw}.crows:empty{display:none}
.crow{display:flex;align-items:center;gap:4.4cqw;height:17.9cqw;box-sizing:border-box;padding:0 4.3cqw 0 4.8cqw;border-radius:4.5cqw;background:#2c2d3f;border:1px solid rgba(255,255,255,.07);cursor:pointer;color:#fff}
.hex{width:8cqw;height:9.2cqw;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:3.6cqw;color:#fff}
.crow .m{flex:1;min-width:0}
.crow .n{font-size:3.58cqw;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .p{font-size:3.15cqw;font-weight:500;color:#a6a6b6;margin-top:.6cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .r{text-align:right;flex:none;max-width:46%}
.crow .a{font-size:3.58cqw;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .f{font-size:3.15cqw;font-weight:500;color:#a6a6b6;margin-top:.6cqw;white-space:nowrap}
.crow .sym{display:none;color:#d8d8e4}.extra.hid .crow .amt{display:none}.extra.hid .crow .sym{display:block}
.addmore{align-self:center;margin-top:5.2cqw;width:22.9cqw;height:8.9cqw;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:#2c2b40;color:#fff;font:inherit;font-size:3.26cqw;font-weight:500;cursor:pointer;-webkit-tap-highlight-color:transparent}
.addmore:focus-visible,.crow:focus-visible{outline:2px solid #fff}
</style></head><body>
<div id="phone"></div>
<script src="cfg.js"></script>
<script>
const imgSrc=k=>'img/'+k+'.webp';
const P=document.getElementById('phone');
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};
function build(key,parent){
  const c=CFG[key],s=$('<div class="screen" data-k="'+key+'"></div>');
  let host=s;
  if(key==='wallet'){const sc=$('<div class="scroller"></div>');host=$('<div class="content"></div>');
    host.style.aspectRatio=c.ar;sc.appendChild(host);
    const ex=$('<div class="extra"><div class="crows"></div><button type="button" class="addmore">Add More</button></div>');sc.appendChild(ex);
    s.appendChild(sc);s.scroller=sc;s.content=host;s.extra=ex}
  host.appendChild($('<img src="'+imgSrc(key)+'" alt="" draggable="false">'));
  c.items.forEach(it=>{
    if(!it.runs.length)return;
    const d=$('<div class="tx '+it.a+'"></div>');
    if(it.k)d.dataset.k=it.k;if(it.hid)d.dataset.hidden='1';
    d.style.cssText=`left:${it.box[0]}%;top:${it.box[1]}%;width:${it.box[2]}%;height:${it.box[3]}%;opacity:${it.op}`;
    it.runs.forEach(r=>{const e=document.createElement('span');e.textContent=r.t;e.style.cssText=`font-size:${r.s}cqw;color:${r.c};font-weight:${r.w}`;d.appendChild(e)});
    host.appendChild(d)});
  parent.appendChild(s);return s}
// hotspots in 921x2000 space
function hs(s,x0,y0,x1,y1,fn,H=2001){const h=$('<div class="hs"></div>');
  h.style.cssText=`left:${x0/9.21}%;top:${y0/H*100}%;width:${(x1-x0)/9.21}%;height:${(y1-y0)/H*100}%`;
  h.addEventListener('click',e=>{e.stopPropagation();fn()});s.appendChild(h)}
const scr={};['wallet','cash','swap'].forEach(k=>scr[k]=build(k,P));
P.appendChild($('<div id="scrim"></div>'));
const port=$('<div id="port"></div>');P.appendChild(port);const portS=build('port',port);
const addp=$('<div id="addp"></div>');P.appendChild(addp);const addS=build('add',addp);
const scrim=document.getElementById('scrim');
let openEl=null;
function go(k){Object.entries(scr).forEach(([n,s])=>s.classList.toggle('on',n===k));closeSheet();
  nav.dataset.t=k;if(k!=='wallet')nav.classList.remove('away');if(k==='cash')startHL()}
function openSheet(el){openEl=el;scrim.classList.add('on');el.classList.add('on')}
function closeSheet(){scrim.classList.remove('on');port.classList.remove('on');addp.classList.remove('on');openEl=null}
const openPort=()=>openSheet(port);
scrim.onclick=closeSheet;
[port,addp].forEach(el=>{ // drag the sheet down to close, tap the handle to close
  let y0=null,dy=0;
  el.addEventListener('pointerdown',e=>{e.stopPropagation();y0=e.clientY;dy=0;el.classList.add('drag');el.setPointerCapture&&el.setPointerCapture(e.pointerId)});
  el.addEventListener('pointermove',e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);el.style.transform=dy?`translateY(${dy}px)`:''});
  const end=e=>{if(y0==null)return;const tap=Math.abs(e.clientY-y0)<6&&e.clientY-el.getBoundingClientRect().top<120;
    el.classList.remove('drag');el.style.transform='';if(dy>90||tap)closeSheet();y0=null};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)});
const W=scr.wallet,CH=921/CFG.wallet.ar;
const nav=$('<div class="nav" data-t="wallet"><img class="iw" src="'+imgSrc('navw')+'" alt=""><img class="ic" src="'+imgSrc('navc')+'" alt=""><img class="is" src="'+imgSrc('navs')+'" alt=""></div>');
[['wallet','Wallet',0],['swap','Swap',33.3],['cash','Cash',66.6]].forEach(([k,l,x])=>{const b=$('<button type="button" aria-label="'+l+'"></button>');b.style.left=x+'%';b.onclick=()=>go(k);nav.appendChild(b)});
P.appendChild(nav);
hs(W.content,130,250,800,925,()=>{W.content.classList.toggle('hid');W.extra.classList.toggle('hid',W.content.classList.contains('hid'))},CH);
hs(W.content,30,125,118,215,openPort,CH);
(()=>{let last=0;W.scroller.addEventListener('scroll',()=>{const y=W.scroller.scrollTop;
  if(y>last+4&&y>150)nav.classList.add('away');else if(y<last-4||y<150)nav.classList.remove('away');last=y},{passive:true})})();
hs(scr.cash,326,997,595,1078,()=>openSheet(addp));

/* ---------- rotating headline on Cash ---------- */
const HL=[['Earn rewards','on your activity'],['Earn rewards','as you spend'],['Send money','with no fees'],['Send money','to anyone'],['Spend cash','with your card'],['Spend cash','everywhere']];
const hl=$('<div class="hl in"><div class="a"></div><div class="b"></div></div>');scr.cash.appendChild(hl);
let hi=0,hlT=null;
function setHL(){hl.children[0].textContent=HL[hi][0];hl.children[1].textContent=HL[hi][1];hl.className='hl';void hl.offsetWidth;hl.className='hl in'}
function startHL(){clearInterval(hlT);setHL();hlT=setInterval(()=>{if(!scr.cash.classList.contains('on')){clearInterval(hlT);return}
  hl.className='hl out';setTimeout(()=>{hi=(hi+1)%HL.length;setHL()},360)},3600)}
/* ---------- editable balances and coins ---------- */
const DEF={cash:0,btc:0.00015,btcP:81582,ltc:0.100129,ltcP:59.31,coins:[]};
let D=JSON.parse(JSON.stringify(DEF));
try{Object.assign(D,JSON.parse(localStorage.getItem('walletui')||'{}'));if(!Array.isArray(D.coins))D.coins=[]}catch(e){}
const money=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const amt=n=>String(Number(n.toFixed(6)));
const fmtP=n=>n>=1?money(n):n.toLocaleString('en-US',{maximumFractionDigits:6});
const COLORS=['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16'];
const colorFor=s=>{let x=0;for(const ch of s)x=(x*31+ch.charCodeAt(0))>>>0;return COLORS[x%COLORS.length]};
const find=(root,f)=>[...root.querySelectorAll('.tx')].find(d=>f(d.textContent.trim(),d));
const R={
 wBal:find(scr.wallet,(t,d)=>d.dataset.k==='bal'),
 wAmtB:find(scr.wallet,t=>t==='0.00015 BTC'),wFiatB:find(scr.wallet,t=>t==='$12.24'),
 wAmtL:find(scr.wallet,t=>t==='0.100129 LTC'),wFiatL:find(scr.wallet,t=>t==='$5.94'),
 wPrB:find(scr.wallet,t=>t.startsWith('$81,582.00')),wPrL:find(scr.wallet,t=>t.startsWith('$59.31')),
 pBal:find(portS,(t,d)=>d.children.length===3&&d.children[1].textContent==='17'),
 pCash:find(portS,t=>t==='$0'),pCashP:find(portS,t=>t==='0%'),pWal:find(portS,(t,d)=>d.children.length===1&&t==='$17.88'),pWalP:find(portS,t=>t==='100%'),
 pBP:find(portS,t=>t==='67.4%'),pBU:find(portS,t=>t==='$12.05'),pLP:find(portS,t=>t==='32.6%'),pLU:find(portS,t=>t==='$5.83')};
const setT=(d,t)=>{d.children[0].textContent=t};
const coinsVal=list=>list.reduce((s,c)=>s+c.amt*c.price,0);
function totals(){const b=D.btc*D.btcP,l=D.ltc*D.ltcP,c=coinsVal(D.coins),w=b+l+c;return{b,l,c,w,all:w+D.cash}}
const crows=W.extra.querySelector('.crows');
function render(){
  const T=totals(),sp=n=>{const s=money(n).split('.');return[s[0],'.'+s[1]]};
  const bw=sp(T.w);R.wBal.children[1].textContent=bw[0];R.wBal.children[2].textContent=bw[1];
  const ba=sp(T.all);R.pBal.children[1].textContent=ba[0];R.pBal.children[2].textContent=ba[1];
  setT(R.wAmtB,amt(D.btc)+' BTC');setT(R.wAmtL,amt(D.ltc)+' LTC');
  setT(R.wFiatB,'$'+money(T.b));setT(R.wFiatL,'$'+money(T.l));
  R.wPrB.children[0].textContent='$'+money(D.btcP)+' ';R.wPrL.children[0].textContent='$'+money(D.ltcP)+' ';
  setT(R.pCash,'$'+(D.cash%1?money(D.cash):D.cash));setT(R.pWal,'$'+money(T.w));
  const pc=(x,t)=>t>0?Math.round(x/t*100)+'%':'0%';
  setT(R.pCashP,pc(D.cash,T.all));setT(R.pWalP,pc(T.w,T.all));
  const bl=T.b+T.l,pl=x=>bl>0?(x/bl*100).toFixed(1)+'%':'0%';
  setT(R.pBP,pl(T.b));setT(R.pLP,pl(T.l));setT(R.pBU,'$'+money(T.b));setT(R.pLU,'$'+money(T.l));
  crows.textContent='';
  D.coins.forEach(c=>{
    const r=$('<div class="crow" role="button" tabindex="0"><div class="hex"></div><div class="m"><div class="n"></div><div class="p"></div></div><div class="r"><div class="a amt"></div><div class="f amt"></div><div class="a sym"></div></div></div>');
    const q=s=>r.querySelector(s);
    q('.hex').style.background=c.color;q('.hex').textContent=(c.sym||c.name).charAt(0);
    q('.n').textContent=c.name;q('.p').textContent='$'+fmtP(c.price);
    q('.r .a.amt').textContent=amt(c.amt)+' '+c.sym;q('.f').textContent='$'+money(c.amt*c.price);q('.sym').textContent=c.sym;
    r.onclick=()=>openEdit();r.onkeydown=e=>{if(e.key==='Enter')openEdit()};
    crows.appendChild(r)});
}
const edit=$(`<div id="edit"><div class="sheet"><div class="grab"></div><h2>Editar saldo</h2>
<div class="tot">Total en wallet <b id="eTot">$0.00</b></div>
<div class="g">
<label class="w" for="eCash">Cash ($)<input id="eCash" inputmode="decimal" autocomplete="off"></label>
<label for="eBtc">Bitcoin (BTC)<input id="eBtc" inputmode="decimal" autocomplete="off"></label>
<label for="eBtcP">Precio BTC ($)<input id="eBtcP" inputmode="decimal" autocomplete="off"></label>
<label for="eLtc">Litecoin (LTC)<input id="eLtc" inputmode="decimal" autocomplete="off"></label>
<label for="eLtcP">Precio LTC ($)<input id="eLtcP" inputmode="decimal" autocomplete="off"></label>
</div>
<h3>Monedas agregadas</h3><div id="eCoins"></div>
<h3>Nueva moneda</h3>
<div class="g">
<label for="eNName">Nombre<input id="eNName" maxlength="24" autocomplete="off" placeholder="Solana"></label>
<label for="eNSym">Símbolo<input id="eNSym" maxlength="8" autocomplete="off" placeholder="SOL"></label>
<label for="eNAmt">Cantidad<input id="eNAmt" inputmode="decimal" autocomplete="off" placeholder="0"></label>
<label for="eNPrice">Precio ($)<input id="eNPrice" inputmode="decimal" autocomplete="off" placeholder="0"></label>
</div><button id="eAdd" class="a" type="button">Agregar moneda</button>
<div class="b"><button id="eReset" type="button">Restablecer</button><button id="eSave" class="p" type="button">Guardar</button></div></div></div>`);
P.appendChild(edit);
const $e=id=>document.getElementById(id);
const F={cash:'eCash',btc:'eBtc',btcP:'eBtcP',ltc:'eLtc',ltcP:'eLtcP'};
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)&&n>=0?n:0};
let draft=[];
function preview(){$e('eTot').textContent='$'+money(num($e('eBtc').value)*num($e('eBtcP').value)+num($e('eLtc').value)*num($e('eLtcP').value)+coinsVal(draft))}
function drawCoins(){
  const box=$e('eCoins');box.textContent='';
  if(!draft.length){const p=$('<p class="empty"></p>');p.textContent='Todavía no agregaste ninguna.';box.appendChild(p);return}
  draft.forEach(c=>{
    const b=$('<div class="cb"><div class="ch"><div class="t"></div><button type="button" aria-label="Quitar moneda">×</button></div><div class="g"><label>Cantidad<input data-f="amt" inputmode="decimal" autocomplete="off"></label><label>Precio ($)<input data-f="price" inputmode="decimal" autocomplete="off"></label></div></div>');
    b.querySelector('.t').textContent=c.name;const i=document.createElement('i');i.textContent=c.sym;b.querySelector('.t').appendChild(i);
    b.querySelectorAll('input').forEach(inp=>{inp.value=c[inp.dataset.f];inp.addEventListener('input',()=>{c[inp.dataset.f]=num(inp.value);preview()})});
    b.querySelector('button').onclick=()=>{draft=draft.filter(x=>x!==c);drawCoins();preview()};
    box.appendChild(b)})}
function addCoin(){
  let name=$e('eNName').value.trim(),sym=$e('eNSym').value.trim().toUpperCase();
  if(!name&&!sym){$e('eNName').focus();return false}
  if(!sym)sym=name.slice(0,4).toUpperCase();if(!name)name=sym;
  if(draft.length>=30)return false;
  draft.push({id:Date.now()+Math.random(),name,sym,amt:num($e('eNAmt').value),price:num($e('eNPrice').value),color:colorFor(sym)});
  ['eNName','eNSym','eNAmt','eNPrice'].forEach(id=>$e(id).value='');
  drawCoins();preview();return true}
function openEdit(focusNew){
  for(const k in F)$e(F[k]).value=D[k];
  draft=D.coins.map(c=>Object.assign({},c));drawCoins();preview();edit.classList.add('on');
  if(focusNew===true)setTimeout(()=>{const sh=edit.querySelector('.sheet'),n=$e('eNName');
    sh.scrollTop+=n.getBoundingClientRect().top-sh.getBoundingClientRect().top-140;n.focus({preventScroll:true});P.scrollTop=0},60)}
function closeEdit(){edit.classList.remove('on')}
Object.values(F).forEach(id=>$e(id).addEventListener('input',preview));
$e('eAdd').onclick=addCoin;
edit.addEventListener('pointerdown',e=>e.stopPropagation());
edit.addEventListener('click',e=>{if(e.target===edit)closeEdit()});
$e('eSave').onclick=()=>{if($e('eNName').value.trim()||$e('eNSym').value.trim())addCoin();
  for(const k in F)D[k]=num($e(F[k]).value);D.coins=draft;
  try{localStorage.setItem('walletui',JSON.stringify(D))}catch(e){}render();closeEdit()};
$e('eReset').onclick=()=>{D=JSON.parse(JSON.stringify(DEF));try{localStorage.removeItem('walletui')}catch(e){}render();closeEdit()};
W.extra.querySelector('.addmore').onclick=()=>openEdit(true);
render();

/* ---------- hold the screen 1.5 s to open the editor ---------- */
let timer=null,sx=0,sy=0,suppress=false;
const cancel=()=>{clearTimeout(timer);timer=null};
P.addEventListener('pointerdown',e=>{
  if(edit.classList.contains('on'))return;
  suppress=false;sx=e.clientX;sy=e.clientY;cancel();
  timer=setTimeout(()=>{timer=null;suppress=true;openEdit()},1500)});
P.addEventListener('pointermove',e=>{if(timer&&Math.hypot(e.clientX-sx,e.clientY-sy)>14)cancel()});
['pointerup','pointercancel','pointerleave'].forEach(n=>P.addEventListener(n,cancel));
P.addEventListener('click',e=>{if(suppress){e.stopPropagation();e.preventDefault();suppress=false}},true);
P.addEventListener('contextmenu',e=>e.preventDefault());
go('wallet');
</script></body></html>
