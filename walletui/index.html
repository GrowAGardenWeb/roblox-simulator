  hd.style.left=(x/9.21)+'%';hd.style.top=(arcY(x)/8.8)+'%';hd.style.transform='translate(-50%,-50%) rotate('+(-th*180/Math.PI).toFixed(2)+'deg)';
  const w=bq('#bsWarn');w.classList.toggle('on',!!c.warn);if(c.warn)w.querySelector('span').textContent=c.warn;
  bq('#bsPayL').textContent=m==='buy'?'Pay with':'Receive via';
  const go=bq('#bsGo');go.classList.toggle('off',m==='buy'&&!c.ok);go.classList.toggle('hide',m==='sell'&&!c.ok)}
function openBS(mode,sym){BS.mode=mode;if(sym)BS.sym=sym;
  if(mode==='sell'&&!(bsBal()>0)){const f=COINS.find(k=>D.c[k[0]].amt>0);if(f)BS.sym=f[0]}
  BS.usd=BS_MIN;BS.coin=0;bq('.bsamt').classList.remove('edit');bsRender();bsp.classList.add('on');setTimeout(fxSize,60)}

  BS.mode=m;if(m==='sell'&&!(bsBal()>0)){const f=COINS.find(k=>D.c[k[0]].amt>0);if(f)BS.sym=f[0]}BS.usd=BS_MIN;BS.coin=0;bsRender();fxSpawn(14,.4)});

  if(BS.mode==='buy')BS.usd=Math.round(BS_MIN+p*(BS_MAX-BS_MIN));else BS.coin=Number((p*bsBal()).toFixed(6));
  fxSpawn(Math.round(Math.abs(p-lastP)*60)+(p>.02?1:0),p);lastP=p;bsRender()}
dial.addEventListener('pointerdown',e=>{dragging=true;dial.setPointerCapture(e.pointerId);bq('.bsamt').classList.remove('edit');bsDrag(e)});
dial.addEventListener('pointermove',e=>{if(dragging)bsDrag(e)});
['pointerup','pointercancel'].forEach(n=>dial.addEventListener(n,()=>{dragging=false}));

const bsIn=bq('#bsIn');

bsIn.addEventListener('input',()=>{const v=num(bsIn.value);if(BS.mode==='buy')BS.usd=v;else BS.coin=v;const n=bq('.bsamt .n');n.textContent=bsIn.value||'0';bsRender();bq('.bsamt .n').textContent=bsIn.value||'0'});
bsIn.addEventListener('blur',()=>{bq('.bsamt').classList.remove('edit');bsRender()});
bsIn.addEventListener('keydown',e=>{if(e.key==='Enter')bsIn.blur()});
bsp.addEventListener('focusin',()=>requestAnimationFrame(()=>{P.scrollTop=0}));

function runFlow(sym,label,mutate,t){closeBS();closeSheet();pillT.forEach(clearTimeout);pillT=[];
  setTimeout(()=>{openCoin(sym);pill.className='cpill';pill.querySelector('.pt').textContent=label;coinp.classList.add('pend');void pill.offsetWidth;pill.classList.add('on');
    pillT.push(setTimeout(()=>{mutate();D.tx.push(t);try{localStorage.setItem('walletui2',JSON.stringify(D))}catch(e){}render();pill.classList.add('ok');
      pillT.push(setTimeout(()=>{pill.classList.remove('on','ok');coinp.classList.remove('pend')},1700));
      pillT.push(setTimeout(()=>{t.pending=false;try{localStorage.setItem('walletui2',JSON.stringify(D))}catch(e){}render()},8000))},1500))},350)}
bq('#bsGo').onclick=()=>{const c=bsCalc();if(!c.ok)return;const sym=BS.sym,now=Date.now();
  if(BS.mode==='buy')runFlow(sym,'Buy $'+(c.usd%1?money(c.usd):c.usd),()=>{D.c[sym].amt+=c.coin},{id:now+Math.random(),sym,type:'buy',other:'',amt:c.coin,usd:c.usd,ts:now,pending:true});
  else runFlow(sym,'Sell $'+money(c.usd),()=>{D.c[sym].amt=Math.max(0,D.c[sym].amt-c.coin);D.cash+=c.usd},{id:now+Math.random(),sym,type:'sell',other:'',amt:c.coin,usd:c.usd,ts:now,pending:true})};

let timer=null,sx=0,sy=0,suppress=false;

P.addEventListener('pointerdown',e=>{
  if(edit.classList.contains('on'))return;
  suppress=false;sx=e.clientX;sy=e.clientY;cancel();
