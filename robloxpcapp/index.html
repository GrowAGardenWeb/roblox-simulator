<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roblox</title>
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="win" id="win">
  <header class="tb" id="tb">
    <img class="tb-ic" src="img/app.webp" alt="">
    <span class="tb-t">Roblox</span>
    <div class="tb-btns">
      <button id="wmin" aria-label="Minimize"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="#111" stroke-width="1"/></svg></button>
      <button id="wmax" aria-label="Maximize"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="2.5" width="6.5" height="6.5" rx="1" fill="none" stroke="#111"/><path d="M3 2.5V1.8C3 1.4 3.3 1 3.8 1H8.2C8.6 1 9 1.4 9 1.8V6.2C9 6.6 8.6 7 8.2 7H7.5" fill="none" stroke="#111"/></svg></button>
      <button id="wcls" class="x" aria-label="Close"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9" stroke="#111" stroke-width="1"/></svg></button>
    </div>
  </header>

  <div class="app">
    <nav class="side">
      <button class="menu" aria-label="Menu"><img src="img/i_menu.webp" alt="" style="width:38px;height:34px"><i class="dot"></i></button>
      <button class="sb on" data-s="home"><img class="si" src="img/n_home.webp" alt="" style="width:30px;height:30px"><span>Home</span></button>
      <button class="sb" data-s="moments"><img class="si" src="img/n_moments.webp" alt="" style="width:30px;height:28px"><span>Moments</span></button>
      <button class="sb" data-s="chat"><img class="si" src="img/n_chat.webp" alt="" style="width:30px;height:26px"><span>Chat</span></button>
      <button class="sb" data-s="me"><img class="si av" src="img/av_side.webp" alt="" style="width:28px;height:28px"><span>Me</span></button>
      <button class="logo-b" aria-label="Roblox"><img src="img/n_logo.webp" alt="" style="width:30px;height:32px"></button>
    </nav>

    <main class="main">
      <div class="top">
        <img class="logo" src="img/logo.webp" alt="Roblox" style="width:112px;height:28px">
        <label class="search"><img src="img/i_search.webp" alt="" style="width:30px;height:26px;margin-left:-6px;margin-right:-4px"><input id="q" type="text" placeholder="Search" autocomplete="off"></label>
        <div class="me">
          <img class="me-av" src="img/av_me.webp" alt="">
          <b id="meName">munfuja</b>
          <img src="img/i_verified.webp" alt="" style="width:34px;height:24px">
          <button class="rbx" id="openRb" aria-label="Robux"><img src="img/i_robux.webp" alt="Robux" style="width:36px;height:30px"></button>
          <button class="bell" aria-label="Notifications"><img src="img/i_bell.webp" alt="" style="width:32px;height:30px"><i class="bdg" id="bellN">3</i></button>
        </div>
      </div>

      <section class="scr" id="s-home">
        <div class="tabs"><button class="on">For you</button><button>Charts</button></div>
        <div class="friends" id="friends"></div>
        <div class="ban" id="ban">
          <div class="ban-art" style="background-image:url(img/banner.webp)"></div>
          <span class="chip" id="banTag">New Chapter</span>
          <h2 id="banT">Escape The Corruption</h2>
          <p id="banS">The Overseer has been summoned</p>
          <button class="play" id="banB">Jo...</button>
          <span class="mat" id="banM">Maturity: Minimal</span>
        </div>
        <h3 class="rh">Recommended For You</h3>
        <div class="games" id="games"></div>
      </section>
    </main>
  </div>
</div>

<section class="rb" id="rb" hidden>
  <div class="rb-bar"><button class="rb-x" id="rbX" aria-label="Close"><img src="img/x_big.webp" alt="" style="width:22px;height:24px"></button><div class="rb-t"><small id="rbU">munfuja: 13+</small><span>Balance: <span id="rbBal">1,000</span> Robux</span></div></div>
  <div class="rb-sc">
    <div class="rb-col">
      <div class="rb-pill"><img src="img/hx_p.webp" alt="" style="width:26px;height:28px"><b id="rbPill">1,000</b><button id="rbSend"><img src="img/i_up.webp" alt="" style="width:14px;height:14px">Send</button></div>
      <h1>Enjoy up to 25%<br>more Robux</h1>
      <h2>Bonus item we picked for you</h2>
      <div class="rb-card">
        <img class="rb-ban" src="img/bed_banner.webp" alt="">
        <div id="rbRows"></div>
      </div>
      <h2 class="h2b">Robux packages</h2>
      <div class="rb-card w" id="rbPk"></div>
    </div>
  </div>
</section>

<div class="sr" id="sr" hidden>
  <div class="sr-box" id="srBox"></div>
</div>
<script src="app.js"></script>
</body>
</html>
